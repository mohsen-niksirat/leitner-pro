// Quiz undo state
let _quizUndoState=null;
let _quizUndoTimer=null;

function handleQuizAnswer(isCorrect){
  // Save undo state before applying
  _quizUndoState={
    cardId:quizState.card.id,
    isCorrect:isCorrect,
    quizCorrect:quizCorrect,
    quizWrong:quizWrong,
    quizSessionStreak:quizSessionStreak,
    statsReviewed:S.stats.reviewed,
    statsCorrect:S.stats.correct,
    statsWrong:S.stats.wrong,
    fsrsSnapshot:{stability:quizState.card.stability,difficulty:quizState.card.difficulty,interval:quizState.card.interval,fsrsState:quizState.card.fsrsState,lapses:quizState.card.lapses,reps:quizState.card.reps,nextReviewDate:quizState.card.nextReviewDate,lastReviewedAt:quizState.card.lastReviewedAt,box:quizState.card.box,easeFactor:quizState.card.easeFactor,elapsedDays:quizState.card.elapsedDays,scheduledDays:quizState.card.scheduledDays},
    dk:todayKey(),
    dkHistory:S.stats.history[todayKey()]?{...S.stats.history[todayKey()]}:null
  };

  if(isCorrect){quizCorrect++;quizSessionStreak++;toast('درست! ✓','success')}
  else{quizWrong++;quizSessionStreak=0;toast('نادرست! ✗','error')}
  // XP for quiz
  const xpGain=isCorrect?5:1;
  S.stats.xp+=xpGain;
  S.stats.reviewed++;
  if(isCorrect)S.stats.correct++;else S.stats.wrong++;
  const dk=todayKey();
  if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};
  S.stats.history[dk].reviewed++;
  if(isCorrect)S.stats.history[dk].correct++;else S.stats.history[dk].wrong++;
  // Streak
  if(S.stats.lastReviewDate!==dk){if(S.stats.lastReviewDate===new Date(Date.now()-MS_PER_DAY).toISOString().slice(0,10))S.stats.streak++;else S.stats.streak=1;S.stats.lastReviewDate=dk}
  // FSRS update
  if(quizState.card){
    const w=S.words.find(x=>x.id===quizState.card.id);
    if(w){fsrsNext(w,isCorrect?3:1);save()}else save();
  }else save();
  // Persistence
  updateQuizWordPerformance(quizState.card.id,isCorrect);
  // Record confusion if wrong
  if(!isCorrect&&quizState.card&&quizState.selected>=0){
    const selectedOption=quizState.options[quizState.selected];
    const correctWord=quizState.card;
    // Find which word was selected
    const confusedWord=S.words.find(x=>x.translation===selectedOption||x.word===selectedOption);
    if(confusedWord)recordConfusion(correctWord.id,confusedWord.id);
  }
  // Session-aware scheduling
  recordSessionAnswer(quizState.card.id,isCorrect);
  _quizQuestionNum++;
  if(S.quizStats&&S.quizStats.currentSession){
    if(isCorrect)S.quizStats.currentSession.correct++;else S.quizStats.currentSession.wrong++;
    S.quizStats.currentSession.words.push({id:quizState.card.id,correct:isCorrect});
    save();
  }
  // Start undo timer
  if(_quizUndoTimer)clearTimeout(_quizUndoTimer);
  _quizUndoTimer=setTimeout(()=>{_quizUndoState=null;_quizUndoTimer=null},3500);
}

function undoQuizAnswer(){
  if(!_quizUndoState)return;
  const u=_quizUndoState;
  _quizUndoState=null;if(_quizUndoTimer){clearTimeout(_quizUndoTimer);_quizUndoTimer=null}

  // Restore counters
  quizCorrect=u.quizCorrect;
  quizWrong=u.quizWrong;
  quizSessionStreak=u.quizSessionStreak;
  S.stats.reviewed=u.statsReviewed;
  S.stats.correct=u.statsCorrect;
  S.stats.wrong=u.statsWrong;
  // Restore daily history
  if(u.dkHistory)S.stats.history[u.dk]=u.dkHistory;
  else delete S.stats.history[u.dk];
  // Restore FSRS state
  const w=S.words.find(x=>x.id===u.cardId);
  if(w&&u.fsrsSnapshot){
    Object.assign(w,u.fsrsSnapshot);
  }
  // Undo XP
  S.stats.xp-=u.isCorrect?5:1;
  if(S.stats.xp<0)S.stats.xp=0;
  // Undo session tracking
  if(S.quizStats&&S.quizStats.currentSession){
    if(u.isCorrect)S.quizStats.currentSession.correct--;else S.quizStats.currentSession.wrong--;
    S.quizStats.currentSession.words.pop();
  }
  _quizQuestionNum--;
  save();
  // Re-show the same question (reset quiz state)
  quizState.answered=false;
  quizState.selected=-1;
  toast('پاسخ لغو شد','info');
  renderQuiz(document.getElementById('content'));
  initQuiz();
}

function getLevel(xp){
  const levels=[
    {name:'مبتدی',icon:'🌱',min:0},
    {name:'تازه‌کار',icon:'📗',min:50},
    {name:' học viên',icon:'📘',min:150},
    {name:'ระดับกลาง',icon:'📙',min:350},
    {name:'پیشرفته',icon:'📕',min:700},
    {name:'حرفه‌ای',icon:'🎓',min:1200},
    {name:'استاد',icon:'🏆',min:2000},
    {name:'اسطوره',icon:'👑',min:3500},
    {name:'بی‌نهایت',icon:'⚡',min:5000}
  ];
  let current=levels[0];
  let next=levels[1];
  for(let i=levels.length-1;i>=0;i--){if(xp>=levels[i].min){current=levels[i];next=levels[i+1]||null;break}}
  const progress=next?((xp-current.min)/(next.min-current.min)*100):100;
  return{...current,next,progress:Math.min(100,progress),xp};
}

// ═══════════════════════════════════════════
// QUIZ GENERATOR (Smart Selection + Adaptive)
// ═══════════════════════════════════════════
function genQuiz(){
if(quizState.timer){clearTimeout(quizState.timer);quizState.timer=null}
const valid=S.words.filter(w=>w.translation&&w.translation.trim());
if(valid.length<4)return;

// Weighted selection: weaker words appear more often, skip session-skipped
const weights=valid.map(w=>{
  if(shouldSkipInSession(w.id))return 0;
  const strength=getWordStrength(w);
  const inHistory=quizHistory.includes(w.id);
  return Math.max(0.1,(1-strength+0.1)*(inHistory?0.2:1));
});
const totalWeight=weights.reduce((a,b)=>a+b,0);
let r=Math.random()*totalWeight;
let w=valid[0];
for(let i=0;i<valid.length;i++){r-=weights[i];if(r<=0){w=valid[i];break}}

// Adaptive difficulty: pick distractors based on streak
const difficulty=quizSessionStreak>=3?0.8:quizSessionStreak>=1?0.5:0.2;

if(quizMode==='mcq'||quizMode==='reverse'){
  const opts=new Set();
  const target=quizMode==='reverse'?w.word:w.translation;
  opts.add(target);
  const distractors=S.words.filter(x=>x.id!==w.id&&x.translation&&x.translation.trim());
  const distractorField=quizMode==='reverse'?'word':'translation';
  // Sort: confusion partners first, then by frequency tier proximity
  const targetTier=getFrequencyTier(w.word);
  const confusionIds=new Set(getConfusionPartners(w.id));
  distractors.sort((a,b)=>{
    const aConfused=confusionIds.has(a.id)?0:1;
    const bConfused=confusionIds.has(b.id)?0:1;
    if(aConfused!==bConfused)return aConfused-bConfused;
    const aDiff=Math.abs(getFrequencyTier(a.word)-targetTier);
    const bDiff=Math.abs(getFrequencyTier(b.word)-targetTier);
    return aDiff-bDiff;
  });
  const poolSize=Math.ceil(distractors.length*difficulty);
  const hardPool=distractors.slice(0,Math.max(3,poolSize));
  const seen=new Set([target]);
  for(let i=0;i<3&&hardPool.length;i++){const rIdx=Math.floor(Math.random()*hardPool.length);const r=hardPool.splice(rIdx,1)[0];const val=r[distractorField];if(!seen.has(val)){opts.add(val);seen.add(val)}}
  quizState={card:w,options:[...opts].sort(()=>Math.random()-.5),answered:false,selected:-1,timer:null,quizText:''};
}else if(quizMode==='antonym'){
  const opts=new Set();
  let correctAntonym=w.antonyms&&w.antonyms.length>0?w.antonyms[0]:null;
  if(!correctAntonym){correctAntonym=w.translation;}// fallback
  opts.add(correctAntonym);
  const others=S.words.filter(x=>x.id!==w.id&&x.translation);
  const seen=new Set([correctAntonym]);
  for(let i=0;i<3&&others.length;i++){const rIdx=Math.floor(Math.random()*others.length);const r=others.splice(rIdx,1)[0];const val=r.translation;if(!seen.has(val)){opts.add(val);seen.add(val)}}
  quizState={card:w,options:[...opts].sort(()=>Math.random()-.5),answered:false,selected:-1,timer:null,quizText:correctAntonym};
}else if(quizMode==='sentfill'){
  let sentence=w.context||'';if(!sentence&&w.examples&&w.examples.length>0)sentence=w.examples[0];
  if(!sentence)sentence=`The word "${w.word}" means ___`;
  quizState={card:w,options:[],answered:false,selected:-1,timer:null,quizText:sentence};
}else if(quizMode==='spell'){
  quizState={card:w,options:[],answered:false,selected:-1,timer:null,quizText:''};
}else if(quizMode==='defmatch'){
  const opts=new Set();
  opts.add(w.word);
  let definition=w.coreMeaning||'';if(!definition&&w.definitions&&w.definitions.length>0)definition=w.definitions[0];
  const others=S.words.filter(x=>x.id!==w.id);
  const seen=new Set([w.word]);
  for(let i=0;i<3&&others.length;i++){const rIdx=Math.floor(Math.random()*others.length);const r=others.splice(rIdx,1)[0];if(!seen.has(r.word)){opts.add(r.word);seen.add(r.word)}}
  quizState={card:w,options:[...opts].sort(()=>Math.random()-.5),answered:false,selected:-1,timer:null,quizText:definition||w.translation};
}else if(quizMode==='speed'){
  // Speed mode: same as MCQ but with timer
  const opts=new Set();
  opts.add(w.translation);
  const distractors=S.words.filter(x=>x.id!==w.id&&x.translation&&x.translation.trim());
  const seen=new Set([w.translation]);
  for(let i=0;i<3&&distractors.length;i++){const rIdx=Math.floor(Math.random()*distractors.length);const r=distractors.splice(rIdx,1)[0];if(!seen.has(r.translation)){opts.add(r.translation);seen.add(r.translation)}}
  quizState={card:w,options:[...opts].sort(()=>Math.random()-0.5),answered:false,selected:-1,timer:null,quizText:''};
}else{
  // fill, listen
  quizState={card:w,options:[],answered:false,selected:-1,timer:null,quizText:''};
}

quizHistory.push(w.id);if(quizHistory.length>20)quizHistory.shift();
}

function initQuiz(){
if(['fill','listen','sentfill','spell'].includes(quizMode))return;
const c=document.getElementById('quizContainer');
if(!c)return;
c.onclick=e=>{
const btn=e.target.closest('[data-qi]');
if(!btn||quizState.answered)return;
const idx=parseInt(btn.dataset.qi);
quizState.answered=true;
quizState.selected=idx;

let isCorrect;
if(quizMode==='reverse'||quizMode==='defmatch'){
  isCorrect=quizState.options[idx]===quizState.card.word;
}else if(quizMode==='antonym'){
  isCorrect=quizState.options[idx]===quizState.quizText;
}else{
  isCorrect=quizState.options[idx]===quizState.card.translation;
}
handleQuizAnswer(isCorrect);
// Clear speed timer if active
if(quizMode==='speed'&&quizState._speedInterval){clearInterval(quizState._speedInterval);quizState._speedInterval=null}
renderQuiz(document.getElementById('content'));
const autoAdvanceMs=quizMode==='speed'?800:1500;
quizState.timer=setTimeout(()=>{genQuiz();renderQuiz(document.getElementById('content'));initQuiz()},autoAdvanceMs)}}

function renderAiChat(c) {
  // Inject scoped CSS once
  if (!document.getElementById('aiChatProStyles')) {
    const s = document.createElement('style');
    s.id = 'aiChatProStyles';
    s.textContent = AICHAT_CSS;
    document.head.appendChild(s);
  }

  // Render HTML into container
  c.innerHTML = AICHAT_HTML;

  // Initialize AI Chat (only once per render)
  if (typeof window._aiChatInit === 'function') { window._aiChatInit(); }
  else {
    // First time: run the IIFE
    (function() {
'use strict';

// Lazy load Puter.js when needed
let puterLoaded = false;
function loadPuterScript() {
  return new Promise((resolve, reject) => {
    // Already loaded
    if (window.puter && window.puter.ai) return resolve();

    // Script tag exists but SDK not ready yet — wait
    if (document.querySelector('script[src*="puter.com"]')) {
      let tries = 0;
      const wait = setInterval(() => {
        if (window.puter && window.puter.ai) { clearInterval(wait); resolve(); }
        if (++tries > 50) { clearInterval(wait); reject(new Error('Puter SDK بارگذاری شد ولی آماده نشد. صفحه رو رفرش کنید.')); }
      }, 200);
      return;
    }

    // Load fresh
    const s = document.createElement('script');
    s.src = 'https://js.puter.com/v2/';
    s.onload = () => {
      // Wait for SDK to initialize (puter.ai becomes available)
      let tries = 0;
      const wait = setInterval(() => {
        if (window.puter && window.puter.ai) {
          clearInterval(wait);
          try { puter.quiet = true; } catch(e) {}
          resolve();
        }
        if (++tries > 50) {
          clearInterval(wait);
          reject(new Error('Puter SDK لود شد ولی آماده نشد. اتصال اینترنت رو بررسی کنید.'));
        }
      }, 200);
    };
    s.onerror = () => reject(new Error('بارگذاری Puter.js ناموفق بود. اتصال اینترنت رو بررسی کنید.'));
    document.head.appendChild(s);
  });
}

// --- PERSISTENCE ---
function loadState() {
  try {
    const saved = localStorage.getItem('ai_chat_pro');
    state = saved ? { ...DEFAULT_STATE, ...JSON.parse(saved) } : { ...DEFAULT_STATE };
    if (!state.apiKeys) state.apiKeys = { gemini: [''], openrouter: [''], groq: [''], pollinations: [''] };
    // Backward compatibility: convert old single key to array
    ['gemini', 'openrouter', 'groq', 'pollinations'].forEach(p => {
      if (typeof state.apiKeys[p] === 'string') state.apiKeys[p] = state.apiKeys[p] ? [state.apiKeys[p]] : [''];
    });
    if (!state.keyIndex) state.keyIndex = { gemini: 0, openrouter: 0, groq: 0, pollinations: 0 };
    if (!state.providerUsageStats) state.providerUsageStats = { gemini: 0, openrouter: 0, groq: 0, pollinations: 0 };
  } catch { state = { ...DEFAULT_STATE }; }
  checkDailyReset();
}

function saveState() {
  try { localStorage.setItem('ai_chat_pro', JSON.stringify(state)); } catch {}
}

// --- KEY ROTATION ---
function getCurrentKey(provider) {
  const keys = state.apiKeys[provider];
  if (!keys || !Array.isArray(keys) || keys.length === 0) return '';
  const idx = state.keyIndex[provider] || 0;
  const validKeys = keys.filter(k => k && k.trim());
  if (validKeys.length === 0) return '';
  return validKeys[idx % validKeys.length];
}

function rotateKey(provider) {
  const keys = state.apiKeys[provider];
  if (!keys || !Array.isArray(keys)) return;
  const validKeys = keys.filter(k => k && k.trim());
  if (validKeys.length <= 1) return; // No rotation if only one key
  state.keyIndex[provider] = ((state.keyIndex[provider] || 0) + 1) % validKeys.length;
  saveState();
  console.log('[KeyRotation] Switched to key #' + (state.keyIndex[provider] + 1) + ' for ' + provider);
}

function getKeyCount(provider) {
  const keys = state.apiKeys[provider];
  if (!keys || !Array.isArray(keys)) return 0;
  return keys.filter(k => k && k.trim()).length;
}

function checkDailyReset() {
  const today = new Date().toISOString().split('T')[0];
  if (state.dailyUsageDate !== today) {
    state.dailyUsage = 0;
    state.dailyUsageDate = today;
    saveState();
  }
}

  state.chats.unshift(chat);
  state.activeChat = chat.id;
  saveState();
  renderTabs();
  renderMessages();
  return chat;
}

function getActiveChat() {
  return state.chats.find(c => c.id === state.activeChat);
}

function deleteChat(e, chatId) {
  e.stopPropagation();
  state.chats = state.chats.filter(c => c.id !== chatId);
  if (state.activeChat === chatId) {
    state.activeChat = state.chats.length > 0 ? state.chats[0].id : null;
  }
  if (state.chats.length === 0) createChat();
  saveState();
  renderTabs();
  renderMessages();
}

function switchChat(chatId) {
  state.activeChat = chatId;
  saveState();
  renderTabs();
  renderMessages();
}

function renderTabs() {
  const tabs = chatTabs.querySelectorAll('.chat-tab');
  tabs.forEach(t => t.remove());
  const btn = $('newChatBtn');
  state.chats.forEach(chat => {
    const tab = document.createElement('div');
    tab.className = 'chat-tab' + (chat.id === state.activeChat ? ' active' : '');
    tab.innerHTML = `<span class="close-tab" data-id="${chat.id}">✕</span>${escapeHtml(chat.title)}`;
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('close-tab')) {
        deleteChat(e, e.target.dataset.id);
      } else {
        switchChat(chat.id);
      }
    });
    chatTabs.insertBefore(tab, btn);
  });
}

// --- MESSAGES ---
function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}

function renderMessages() {
  const chat = getActiveChat();
  messagesContainer.innerHTML = '';
  if (!chat || chat.messages.length === 0) {
    quickPrompts.style.display = 'flex';
    messagesContainer.appendChild(quickPrompts);
    return;
  }
  quickPrompts.style.display = 'none';
  chat.messages.forEach(msg => {
    const div = document.createElement('div');
    div.className = `message ${msg.role}` + (msg.isError ? ' error' : '');
    let content = '';

    // Images from attachments
    if (msg.attachments && msg.attachments.length > 0) {
      content += '<div class="message-images">';
      msg.attachments.forEach(att => {
        content += `<img src="${att.data}" alt="پیوست" onclick="showLightbox(this.src)">`;
      });
      content += '</div>';
    }

    // Image data (generated)
    if (msg.imageData) {
      content += `<img class="generated-image" src="${msg.imageData}" onclick="showLightbox(this.src)">`;
    }

    // Text
    content += `<div class="message-bubble">${formatMessageText(msg.text)}</div>`;

    // Meta
    content += `<div class="message-meta"><span>${formatTime(msg.timestamp)}</span>`;
    if (msg.role === 'assistant') {
      content += `<button class="copy-btn" data-copy="${escapeAttr(msg.text)}">کپی 📋</button>`;
    }
    content += '</div>';

    div.innerHTML = content;
    messagesContainer.appendChild(div);
  });
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function formatMessageText(text) {
  if (!text) return '';
  // Basic code block formatting
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:var(--bg);padding:12px;border-radius:8px;direction:ltr;text-align:left;overflow-x:auto;margin:8px 0;font-size:0.82rem"><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg);padding:2px 6px;border-radius:4px;font-size:0.85rem;direction:ltr">$1</code>');
  return html;
}

function escapeAttr(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '&#10;')
    .replace(/\r/g, '');
}

    input.dataset.provider = provider;

    toggle.style.cssText = 'background:none;border:none;cursor:pointer;font-size:0.85rem;padding:4px;';
    toggle.addEventListener('click', () => {
      input.type = input.type === 'password' ? 'text' : 'password';
      toggle.textContent = input.type === 'password' ? '👁' : '🙈';
    });
    // Remove button
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '✕';
    remove.style.cssText = 'background:var(--danger);color:#fff;border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:0.7rem;display:flex;align-items:center;justify-content:center;';
    remove.addEventListener('click', () => {
      if (keys.length <= 1) return; // Keep at least one
      keys.splice(i, 1);
      state.apiKeys[provider] = keys;
      saveState();
      renderKeyFields(provider);
    });
    // Key number badge
    const badge = document.createElement('span');
    badge.textContent = '#' + (i + 1);
    badge.style.cssText = 'font-size:0.68rem;color:var(--text2);min-width:20px;text-align:center;';

    row.appendChild(input);
    row.appendChild(toggle);
    if (keys.length > 1) row.appendChild(remove);
    list.appendChild(row);

  const countEl = $(provider + 'KeyCount');

// --- CORS PROXY ---
async function aiFetch(url, opts) {
  const proxies = [
    u => 'https://corsproxy.io/?' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => 'https://corsproxy.org/?' + encodeURIComponent(u),
    u => u // direct
  ];
  let lastErr;
  for (let i = 0; i < proxies.length; i++) {
    try {
      const r = await fetch(proxies[i](url), opts);
      if (r.ok) return r;
      try {
        const errBody = await r.json();
        if (errBody.error || errBody.candidates || errBody.choices) {
          return { ok: false, json: () => Promise.resolve(errBody), status: r.status, statusText: r.statusText };
        }
      } catch {}
      lastErr = new Error('HTTP ' + r.status);
    } catch (e) {
      lastErr = e;
      console.log('[AI] Proxy ' + (i+1) + ' failed:', e.message);
      continue;
    }
  }
  throw new Error('اتصال برقرار نشد. ' + (lastErr ? lastErr.message : ''));
}

// --- IMAGE DETECTION ---
function detectImageRequest(text) {
  const lower = text.toLowerCase();
  return IMAGE_KEYWORDS.some(kw => lower.includes(kw));
}

function hasImageAttachment(chat) {
  const lastMsg = [...chat.messages].reverse().find(m => m.role === 'user');
  return lastMsg?.attachments && lastMsg.attachments.length > 0;
}

// --- SEND MESSAGE ---
async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text && pendingAttachments.length === 0) return;
  if (isGenerating) return;

  // Daily limit check
  checkDailyReset();
  if (state.dailyUsage >= state.dailyLimit) {
    alert('محدودیت روزانه به پایان رسیده! فردا دوباره امتحان کنید.');
    return;
  }

  let chat = getActiveChat();
  if (!chat) chat = createChat();

  // Auto-title from first message
  if (chat.messages.length === 0) {
    chat.title = text.slice(0, 40) + (text.length > 40 ? '...' : '');
    renderTabs();
  }

  // Build user message
  const userMsg = {
    role: 'user',
    text: text,
    timestamp: Date.now(),
    attachments: pendingAttachments.length > 0 ? [...pendingAttachments] : undefined
  };
  chat.messages.push(userMsg);
  chat.updatedAt = Date.now();

  // Clear input
  messageInput.value = '';
  autoResize();
  clearAttachments();
  saveState();
  renderMessages();

  // Check API key (skip for providers that don't need one)
  const apiKey = getCurrentKey(state.provider);
  const noKeyProviders = ['puter_img', 'pollinations'];
  if (!apiKey && !noKeyProviders.includes(state.provider)) {
    const errMsg = { role: 'assistant', text: '❌ لطفاً ابتدا کلید API را در تنظیمات وارد کنید.', timestamp: Date.now(), isError: true };
    chat.messages.push(errMsg);
    saveState();
    renderMessages();
    return;
  }

  // Generate
  isGenerating = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const wantsImage = detectImageRequest(text);
    const response = await callAPI(chat, wantsImage);
    hideTyping();

    const assistantMsg = {
      role: 'assistant',
      text: response.text || '',
      timestamp: Date.now(),
      imageData: response.imageData || undefined
    };
    chat.messages.push(assistantMsg);
    chat.updatedAt = Date.now();
    state.dailyUsage++;
    state.providerUsageStats[state.provider] = (state.providerUsageStats[state.provider] || 0) + 1;
    saveState();
    renderMessages();
  } catch (e) {
    hideTyping();
    let errorMsg = '❌ خطا: ' + e.message;
    // Add helpful suggestions based on error type
    if (e.message.includes('500')) {
      errorMsg += '\n\n💡 سرور موقتاً مشکل داره. چند ثانیه صبر کن و دوباره امتحان کن.';
    } else if (e.message.includes('429') || e.message.includes('quota')) {
      errorMsg += '\n\n💡 محدودیت رایگان تمام شد. از provider دیگه‌ای استفاده کن.';
    } else if (e.message.includes('network') || e.message.includes('fetch')) {
      errorMsg += '\n\n💡 اتصال اینترنت رو بررسی کن.';
    }
    const errMsg = { role: 'assistant', text: errorMsg, timestamp: Date.now(), isError: true };
    chat.messages.push(errMsg);
    saveState();
    renderMessages();
  } finally {
    isGenerating = false;
    sendBtn.disabled = false;
  }
}

// --- API CALLS ---
async function callAPI(chat, wantsImage) {
  if (state.provider === 'gemini') return callGemini(chat, wantsImage);
  if (state.provider === 'openrouter') return callOpenRouter(chat);
  if (state.provider === 'groq') return callGroq(chat);
  if (state.provider === 'pollinations') return callPollinations(chat);
  if (state.provider === 'puter_img') return callPuterImg(chat);
  throw new Error('ارائه‌دهنده نامعتبر');
}

async function callGemini(chat, wantsImage) {
  const apiKey = getCurrentKey('gemini');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${apiKey}`;

  // Build contents
  const contents = [];

  chat.messages.forEach(msg => {
    const parts = [];
    if (msg.attachments && msg.attachments.length > 0) {
      msg.attachments.forEach(att => {
        const base64 = att.data.split(',')[1];
        parts.push({ inlineData: { mimeType: att.type || 'image/png', data: base64 } });
      });
    }
    if (msg.text) parts.push({ text: msg.text });
    if (parts.length > 0) {
      contents.push({ role: msg.role === 'user' ? 'user' : 'model', parts });
    }
  });

  const body = {
    contents,
    generationConfig: {
      temperature: state.temperature,
      maxOutputTokens: state.maxTokens
    }
  };

  // All current Gemini models support image output
  const supportsImage = state.model.includes('gemini-2.5') || state.model.includes('gemini-3') || state.model.includes('image') || state.model.includes('gemini-3.5');
  if (wantsImage || hasImageAttachment(chat)) {
    if (supportsImage) {
      body.generationConfig.responseModalities = ['TEXT', 'IMAGE'];
    }
  }

  // Use native system instruction for Gemini
  if (state.systemPrompt) {
    body.systemInstruction = { parts: [{ text: state.systemPrompt }] };
  }

  const r = await aiFetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await r.json();

  if (!data.candidates || data.candidates.length === 0) {
    const errMsg = data.error?.message || 'پاسخی دریافت نشد (HTTP ' + (r.status || '?') + ')';
    if (data.error?.status === 'RESOURCE_EXHAUSTED' || r.status === 429 || errMsg.includes('429') || errMsg.includes('quota')) {
      // Try rotating to next key
      const keyCount = getKeyCount('gemini');
      if (keyCount > 1) {
        rotateKey('gemini');
        throw new Error('⚠️ کلید #' + ((state.keyIndex.gemini || 0)) + ' محدود شد — سوییچ به کلید بعدی. دوباره امتحان کنید.');
      }
      throw new Error('⚠️ محدودیت رایگان Gemini تمام شد. راه‌حل:\n' +
        '۱. کلید API جدید از aistudio.google.com بسازید\n' +
        '۲. یا از OpenRouter (رایگان) استفاده کنید\n' +
        '۳. یا از Pollinations برای تصویرسازی استفاده کنید');
    }
    throw new Error(errMsg);
  }

  const parts = data.candidates[0].content?.parts || [];
  let text = '';
  let imageData = null;

  for (const part of parts) {
    if (part.text) text += part.text;
    if (part.inlineData) {
      imageData = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
    }
  }

  return { text, imageData };
}

async function callOpenRouter(chat) {
  const apiKey = getCurrentKey('openrouter');
  const url = 'https://openrouter.ai/api/v1/chat/completions';

  const messages = [];
  if (state.systemPrompt) messages.push({ role: 'system', content: state.systemPrompt });

  chat.messages.forEach(msg => {
    if (msg.role === 'user' && msg.attachments && msg.attachments.length > 0) {
      const content = [];
      msg.attachments.forEach(att => {
        content.push({ type: 'image_url', image_url: { url: att.data } });
      });
      if (msg.text) content.push({ type: 'text', text: msg.text });
      messages.push({ role: 'user', content });
    } else {
      messages.push({ role: msg.role, content: msg.text });
    }
  });

  const r = await aiFetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
      'HTTP-Referer': window.location.href,
      'X-Title': 'AI Chat Pro'
    },
    body: JSON.stringify({
      model: state.model,
      messages,
      temperature: state.temperature,
      max_tokens: state.maxTokens
    })
  });
  const data = await r.json();

  if (!data.choices || data.choices.length === 0) {
    const errMsg = data.error?.message || 'پاسخی دریافت نشد';
    if (r.status === 429 || errMsg.includes('429') || errMsg.includes('rate')) {

    throw new Error(errMsg);
  }

  return { text: data.choices[0].message?.content || '' };
}

// --- POLLINATIONS (Free, no API key for generation; key for editing) ---
// Edit models that accept image input
const POLLINATIONS_EDIT_MODELS = ['kontext', 'nanobanana', 'nanobanana-2', 'seedream', 'gptimage', 'klein'];

// Retry wrapper for Pollinations API
async function pollinationsFetch(url, opts, retries = 2) {
  for (let i = 0; i <= retries; i++) {
    try {
      const r = await fetch(url, { ...opts, signal: AbortSignal.timeout(60000) });
      if (r.ok) return r;
      if ((r.status === 500 || r.status === 502) && i < retries) {
        console.log('[Pollinations] Retry ' + (i+1) + '/' + retries + ' after HTTP ' + r.status);
        await new Promise(res => setTimeout(res, 2000 * (i+1)));
        continue;
      }
      throw new Error('HTTP ' + r.status);
    } catch (e) {
      if (i === retries) throw e;
      console.log('[Pollinations] Retry ' + (i+1) + '/' + retries + ': ' + e.message);
      await new Promise(res => setTimeout(res, 2000 * (i+1)));
    }
  }
}

async function callPollinations(chat) {
  const lastUserMsg = [...chat.messages].reverse().find(m => m.role === 'user');
  const prompt = lastUserMsg?.text || 'A beautiful landscape';
  const model = state.model || 'flux';
  const isEditModel = POLLINATIONS_EDIT_MODELS.includes(model);
  const hasImage = lastUserMsg?.attachments && lastUserMsg.attachments.length > 0;
  const pollKey = state.apiKeys?.pollinations || '';

  // If user attached an image — editing requires Pollinations credits
  if (hasImage && (isEditModel || model === 'flux')) {
    const editModel = isEditModel ? model : 'kontext';
    const imgData = lastUserMsg.attachments[0].data;

    // Try Pollinations API with key (requires credits)
    if (pollKey) {
      try {
        const apiUrl = 'https://gen.pollinations.ai/v1/images/edits';
        const formData = new FormData();
        const base64Data = imgData.split(',')[1];
        const byteChars = atob(base64Data);
        const byteArray = new Uint8Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteArray[i] = byteChars.charCodeAt(i);
        const blob = new Blob([byteArray], { type: 'image/png' });

        formData.append('image', blob, 'image.png');
        formData.append('prompt', prompt);
        formData.append('model', editModel);
        formData.append('size', '1024x1024');

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Authorization': '***' + pollKey },
          body: formData
        });

        if (response.ok) {
          const result = await response.json();
          if (result.data && result.data[0]) {
            const imgUrl = result.data[0].url;
            const imgResponse = await fetch(imgUrl);
            const imgBlob = await imgResponse.blob();
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onloadend = () => resolve({
                text: '✏️ تصویر ویرایش شده با Pollinations (' + editModel + '): "' + prompt + '"',
                imageData: reader.result
              });
              reader.onerror = () => reject(new Error('تبدیل تصویر ناموفق بود'));
              reader.readAsDataURL(imgBlob);
            });
          }
        }

        // Check if it's a balance error
        const errData = await response.json().catch(() => ({}));
        if (errData.error?.message?.includes('balance') || errData.error?.message?.includes('pollen')) {
          throw new Error('BALANCE_ZERO');
        }
        throw new Error(errData.error?.message || 'HTTP ' + response.status);
      } catch (e) {
        if (e.message === 'BALANCE_ZERO' || e.message?.includes('Insufficient balance')) {
          // Fall through to suggest Gemini
        } else {
          throw e;
        }
      }
    }

    // No key or no balance — suggest Gemini
    throw new Error(
      '⚠️ ویرایش تصویر با Pollinations نیاز به شارژ (pollen) داره.\n\n' +
      '✅ راه‌حل رایگان: از Gemini استفاده کن!\n' +
      '۱. API key از aistudio.google.com بگیر\n' +
      '۲. Provider رو به Gemini تغییر بده\n' +
      '۳. مدل gemini-2.5-flash یا gemini-3.1-flash-image انتخاب کن\n' +
      '۴. عکس + پرامپت بفرست\n\n' +
      '💰 یا Pollinations رو شارژ کن: enter.pollinations.ai'
    );
  }

  // Regular text-to-image generation (FREE, no key needed)
  const encodedPrompt = encodeURIComponent(prompt);
  const imgUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&model=${model}&nologo=true&seed=${Math.floor(Math.random()*999999)}`;

  const response = await pollinationsFetch(imgUrl);
  if (!response.ok) throw new Error('تولید تصویر ناموفق بود (HTTP ' + response.status + ')');

  const blob = await response.blob();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve({
      text: '🎨 تصویر تولید شده با Pollinations: "' + prompt + '"\nمدل: ' + model,
      imageData: reader.result
    });
    reader.onerror = () => reject(new Error('تبدیل تصویر ناموفق بود'));
    reader.readAsDataURL(blob);
  });
}

async function callPuterImg(chat) {
  try {
    await loadPuterScript();
  } catch (e) {
    throw new Error('Puter SDK لود نشد: ' + e.message + '\n\n💡 راه‌حل: فایل رو با http://localhost باز کنید (نه file://)');
  }

  if (!window.puter || !window.puter.ai) {
    throw new Error('Puter SDK آماده نیست. صفحه رو رفرش کنید یا با http://localhost باز کنید.');
  }

  const lastUserMsg = [...chat.messages].reverse().find(m => m.role === 'user');
  const prompt = lastUserMsg?.text || 'A beautiful landscape';

  // Map model names to Puter.js provider/model options
  const modelMap = {
    'gpt-image-2': { provider: 'openai-image-generation', model: 'gpt-image-2' },
    'flux-2-pro': { provider: 'replicate-image-generation', model: 'black-forest-labs/flux-2-pro' },
    'stable-diffusion-3': { provider: 'replicate-image-generation', model: 'stabilityai/stable-diffusion-3-medium' },
    'grok-imagine-image': { provider: 'xai', model: 'grok-imagine-image' }
  };
  const opts = modelMap[state.model] || modelMap['gpt-image-2'];

  // Use Puter.js txt2img API
  const imgElement = await puter.ai.txt2img(prompt, {
    provider: opts.provider,
    model: opts.model
  });

  // Convert the returned image element to base64
  const canvas = document.createElement('canvas');
  canvas.width = imgElement.naturalWidth || imgElement.width;
  canvas.height = imgElement.naturalHeight || imgElement.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgElement, 0, 0);
  const dataUrl = canvas.toDataURL('image/png');

  return {
    text: '🎨 تصویر تولید شده: "' + prompt + '"',
    imageData: dataUrl
  };
}

// --- ATTACHMENTS ---
let pendingAttachments = [];

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      pendingAttachments.push({ data: e.target.result, type: file.type, name: file.name });
      renderAttachments();
    };
    reader.readAsDataURL(file);
  });
}

function renderAttachments() {
  attachPreview.innerHTML = '';
  pendingAttachments.forEach((att, i) => {
    const div = document.createElement('div');
    div.className = 'attach-item';
    div.innerHTML = `<img src="${att.data}" style="width:60px;height:60px;object-fit:cover;border-radius:8px"><button class="remove-attach" data-idx="${i}">✕</button>`;
    div.querySelector('.remove-attach').addEventListener('click', () => {
      pendingAttachments.splice(i, 1);
      renderAttachments();
    });
    attachPreview.appendChild(div);
  });
}

function clearAttachments() {
  pendingAttachments = [];
  attachPreview.innerHTML = '';
}

// --- EXPORT ---
function exportTxt() {
  const chat = getActiveChat();
  if (!chat) return;
  let text = `عنوان: ${chat.title}\nتاریخ: ${new Date(chat.createdAt).toLocaleString('fa-IR')}\n${'='.repeat(50)}\n\n`;
  chat.messages.forEach(msg => {
    const label = msg.role === 'user' ? '👤 کاربر' : '🤖 دستیار';
    text += `${label} [${formatTime(msg.timestamp)}]:\n${msg.text}\n\n`;
  });
  downloadFile(text, `chat-${chat.id}.txt`, 'text/plain');
}

function exportJson() {
  const chat = getActiveChat();
  if (!chat) return;
  const json = JSON.stringify(chat, null, 2);
  downloadFile(json, `chat-${chat.id}.json`, 'application/json');
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&#10;/g, '\n');
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'کپی شد ✅';
    setTimeout(() => { btn.textContent = 'کپی 📋'; }, 1500);
  });

  // Paste images — works on textarea and document
  function handlePaste(e) {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (file) {
          handleFiles([file]);
          // Show brief feedback
          const toast = document.createElement('div');
          toast.textContent = '📋 تصویر چسبانده شد';
          toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:8px 16px;border-radius:8px;font-size:0.82rem;z-index:999;animation:fadeIn 0.3s;';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 1500);
        }
        break;
      }
    }
  }
  messageInput.addEventListener('paste', handlePaste);
  document.addEventListener('paste', (e) => {
    if (e.target !== messageInput) handlePaste(e);
  });

  // Drag and drop
  const mainArea = $('mainArea');
  let dragCounter = 0;
  mainArea.addEventListener('dragenter', (e) => { e.preventDefault(); dragCounter++; });
  mainArea.addEventListener('dragleave', (e) => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) dragCounter = 0; });
  mainArea.addEventListener('dragover', (e) => e.preventDefault());
  mainArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
  });

  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {

      try{

      }catch(e){}
    };

// Listen for quiz results from external English Quiz iframe
window.addEventListener('message',(event)=>{
  const data=event.data;
  if(!data||!data.type)return;
  if(data.type==='quiz-answer'&&data.wordId){
    const w=S.words.find(x=>x.id===data.wordId||x.word.toLowerCase()===(data.word||'').toLowerCase());
    if(w){fsrsNext(w,data.rating||(data.isCorrect?3:1));save()}
    if(S.quizStats){
      const wordKey=data.wordId||data.word||'unknown';
      updateQuizWordPerformance(wordKey,!!data.isCorrect);
    }
  }
  if(data.type==='quiz-complete'&&data.results){
    if(!S.quizStats)S.quizStats={sessions:[],totalCorrect:0,totalWrong:0,wordPerformance:{},currentSession:null};
    S.quizStats.sessions.push({date:new Date().toISOString(),correct:data.results.correct,wrong:data.results.wrong,mode:'external',duration:0});
    if(S.quizStats.sessions.length>50)S.quizStats.sessions=S.quizStats.sessions.slice(-50);
    S.quizStats.totalCorrect+=data.results.correct;
    S.quizStats.totalWrong+=data.results.wrong;
    if(data.results.wordResults){
      data.results.wordResults.forEach(r=>{
        updateQuizWordPerformance(r.wordId||r.questionId,!!r.correct);
      });
    }
    save();
    toast(`تعیین سطح تمام شد: ${data.results.correct}/${data.results.total}`,'success');
  }
});

// SPEED REVIEW — مرور سریع تایم‌دار
// ═══════════════════════════════════════════
let speedState={queue:[],idx:0,correct:0,wrong:0,done:false,timer:null,secondsLeft:5,totalTime:5,skipped:0};
function renderSpeedReview(c){
  // Always clear existing timer first to prevent duplicates
  if(speedState.timer){clearInterval(speedState.timer);speedState.timer=null}
  // Guard: only render if we're actually on speed review tab
  if(currentTab!=='speedreview')return;
  const due=getDue();
  if(speedState.done){
    const acc=speedState.queue.length?Math.round(speedState.correct/speedState.queue.length*100):0;
    c.innerHTML=`<div class="card" style="max-width:400px;margin:40px auto;text-align:center"><h3 style="margin-bottom:16px">⚡ پایان مرور سریع</h3><div class="stat-grid"><div class="stat-card"><div class="val">${speedState.queue.length}</div><div class="lbl">کل</div></div><div class="stat-card"><div class="val" style="color:var(--success)">${speedState.correct}</div><div class="lbl">درست</div></div><div class="stat-card"><div class="val" style="color:var(--danger)">${speedState.wrong}</div><div class="lbl">نادرست</div></div><div class="stat-card"><div class="val">${acc}%</div><div class="lbl">دقت</div></div></div><div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn btn-primary" type="button" onclick="speedState={queue:[],idx:0,correct:0,wrong:0,done:false,timer:null,secondsLeft:5,totalTime:5,skipped:0};renderSpeedReview(document.getElementById('content'))">🔄 تلاش مجدد</button><button class="btn btn-ghost" type="button" onclick="currentTab='review';render()">بازگشت به مرور</button></div></div>`;
    return;
  }
  if(!speedState.queue.length){
    if(!due.length){c.innerHTML=`<div class="card" style="text-align:center;padding:60px"><div class="empty"><div class="icon">⚡</div><p>کارتی برای مرور سریع نیست</p><p style="font-size:.8rem;margin-top:8px;color:var(--text2)">ابتدا کلماتی اضافه کنید یا منتظر مرور بعدی باشید</p></div></div>`;return}
    speedState.queue=due.slice(0,Math.min(20,due.length));
    speedState.idx=0;speedState.correct=0;speedState.wrong=0;speedState.done=false;
  }
  if(speedState.idx>=speedState.queue.length){speedState.done=true;renderSpeedReview(c);return}
  const w=speedState.queue[speedState.idx];
  const prog=Math.round((speedState.idx/speedState.queue.length)*100);
  // Build 4 options
  const allWords=S.words.filter(x=>x.id!==w.id&&x.translation);
  const wrongOpts=allWords.sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.translation);
  const options=[w.translation,...wrongOpts].sort(()=>Math.random()-0.5);
  const correctIdx=options.indexOf(w.translation);
  c.innerHTML=`<div style="max-width:500px;margin:0 auto">
    <div class="flex" style="justify-content:space-between;margin-bottom:12px">
      <span style="color:var(--text2)">${speedState.idx+1} از ${speedState.queue.length}</span>
      <div class="flex" style="gap:8px;align-items:center">
        <span style="color:var(--success);font-size:.85rem">✅ ${speedState.correct}</span>
        <span style="color:var(--danger);font-size:.85rem">❌ ${speedState.wrong}</span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
    <div id="speedTimer" style="text-align:center;font-size:2rem;font-weight:800;margin:16px 0;color:var(--accent)">${speedState.totalTime}</div>
    <div class="card" style="text-align:center;margin-bottom:16px">
      <div style="font-size:1.8rem;font-weight:700;margin-bottom:16px">${esc(w.word)}</div>
      <div style="display:grid;gap:8px">
        ${options.map((opt,i)=>`<button type="button" class="speed-opt" data-idx="${i}" style="padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:.95rem;cursor:pointer;transition:all .2s">${esc(opt)}</button>`).join('')}
      </div>
    </div>
  </div>`;
  // Timer
  speedState.secondsLeft=speedState.totalTime;
  const timerEl=document.getElementById('speedTimer');
  if(speedState.timer)clearInterval(speedState.timer);
  speedState.timer=setInterval(()=>{
    speedState.secondsLeft--;
    if(timerEl)timerEl.textContent=speedState.secondsLeft;
    if(timerEl)timerEl.style.color=speedState.secondsLeft<=2?'var(--danger)':'var(--accent)';
    if(speedState.secondsLeft<=0){
      clearInterval(speedState.timer);speedState.timer=null;
      // Auto-fail
      speedState.wrong++;
      const idx=S.words.findIndex(x=>x.id===w.id);
      if(idx>=0)fsrsNext(S.words[idx],1);
      S.stats.reviewed++;S.stats.wrong++;
      const dk=todayKey();if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};S.stats.history[dk].reviewed++;S.stats.history[dk].wrong++;
      save();
      // Highlight correct
      document.querySelectorAll('.speed-opt').forEach(b=>{
        if(parseInt(b.dataset.idx)===correctIdx){b.style.background='var(--success)';b.style.color='#fff';b.style.borderColor='var(--success)'}
        b.disabled=true;
      });
      setTimeout(()=>{speedState.idx++;renderSpeedReview(c)},800);
    }
  },1000);
  // Option click
  document.querySelectorAll('.speed-opt').forEach(btn=>{
    btn.onclick=()=>{
      if(speedState.timer){clearInterval(speedState.timer);speedState.timer=null}
      const oi=parseInt(btn.dataset.idx);
      const isCorrect=oi===correctIdx;
      if(isCorrect){
        btn.style.background='var(--success)';btn.style.color='#fff';btn.style.borderColor='var(--success)';
        speedState.correct++;
        const idx=S.words.findIndex(x=>x.id===w.id);
        if(idx>=0)fsrsNext(S.words[idx],4);
        S.stats.reviewed++;S.stats.correct++;S.stats.xp+=5;
      }else{
        btn.style.background='var(--danger)';btn.style.color='#fff';btn.style.borderColor='var(--danger)';
        const correctBtn=document.querySelector(`.speed-opt[data-idx="${correctIdx}"]`);
        if(correctBtn){correctBtn.style.background='var(--success)';correctBtn.style.color='#fff';correctBtn.style.borderColor='var(--success)'}
        speedState.wrong++;
        const idx=S.words.findIndex(x=>x.id===w.id);
        if(idx>=0)fsrsNext(S.words[idx],1);
        S.stats.reviewed++;S.stats.wrong++;
      }
      const dk=todayKey();if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};S.stats.history[dk].reviewed++;if(isCorrect)S.stats.history[dk].correct++;else S.stats.history[dk].wrong++;
      save();
      document.querySelectorAll('.speed-opt').forEach(b=>b.disabled=true);
      setTimeout(()=>{speedState.idx++;renderSpeedReview(c)},600);
    };
  });
}

let listenState={queue:[],idx:0,correct:0,wrong:0,done:false,revealed:false};
function renderListening(c){

    return;
  }
  if(!listenState.queue.length){
    const pool=S.words.length?S.words:due;
    if(!pool.length){c.innerHTML=`<div class="card" style="text-align:center;padding:60px"><div class="empty"><div class="icon">🎧</div><p>کلمه‌ای برای تمرین شنیداری نیست</p></div></div>`;return}
    listenState.queue=pool.sort(()=>Math.random()-0.5).slice(0,Math.min(15,pool.length));
    listenState.idx=0;listenState.correct=0;listenState.wrong=0;listenState.done=false;
  }
  if(listenState.idx>=listenState.queue.length){listenState.done=true;renderListening(c);return}
  const w=listenState.queue[listenState.idx];
  const prog=Math.round((listenState.idx/listenState.queue.length)*100);
  c.innerHTML=`<div style="max-width:500px;margin:0 auto">
    <div class="flex" style="justify-content:space-between;margin-bottom:12px">
      <span style="color:var(--text2)">${listenState.idx+1} از ${listenState.queue.length}</span>
      <div class="flex" style="gap:8px">
        <span style="color:var(--success);font-size:.85rem">✅ ${listenState.correct}</span>
        <span style="color:var(--danger);font-size:.85rem">❌ ${listenState.wrong}</span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
    <div class="card" style="text-align:center;padding:40px">
      <button type="button" class="btn btn-primary" id="listenPlayBtn" style="font-size:2rem;padding:20px 40px;border-radius:20px;margin-bottom:20px">🔊 گوش بده</button>
      <div style="margin-bottom:16px">
        <input type="text" class="input" id="listenInput" placeholder="بنویس چی شنیدی..." style="max-width:300px;font-size:1.1rem;text-align:center;direction:ltr" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button type="button" class="btn btn-success" id="listenCheckBtn">بررسی ✓</button>
        <button type="button" class="btn btn-ghost" id="listenSkipBtn">رد شدن →</button>
        <button type="button" class="btn btn-ghost" id="listenShowBtn">نمایش جواب 👁</button>
      </div>
      <div id="listenFeedback" style="margin-top:16px;display:none"></div>
    </div>
  </div>`;
  const input=document.getElementById('listenInput');
  const playBtn=document.getElementById('listenPlayBtn');
  const feedback=document.getElementById('listenFeedback');
  // Play audio
  function playWord(){speakWord(w.word)}
  playBtn.onclick=playWord;
  setTimeout(playWord,300);
  input.focus();
  // Check
  document.getElementById('listenCheckBtn').onclick=()=>{
    const userAnswer=input.value.trim().toLowerCase();
    const correct=w.word.toLowerCase();
    const isCorrect=userAnswer===correct;
    listenState.revealed=true;
    if(isCorrect){
      listenState.correct++;
      feedback.style.display='block';
      feedback.innerHTML='<div style="color:var(--success);font-size:1.1rem;font-weight:700">✅ درست! «'+esc(w.word)+'» = '+esc(w.translation)+'</div>';
      const idx=S.words.findIndex(x=>x.id===w.id);
      if(idx>=0)fsrsNext(S.words[idx],5);
      S.stats.reviewed++;S.stats.correct++;S.stats.xp+=8;
    }else{
      listenState.wrong++;
      feedback.style.display='block';
      feedback.innerHTML='<div style="color:var(--danger);font-size:1rem;font-weight:600">❌ نادرست! جواب صحیح: <strong>'+esc(w.word)+'</strong> = '+esc(w.translation)+'</div>';
      const idx=S.words.findIndex(x=>x.id===w.id);
      if(idx>=0)fsrsNext(S.words[idx],1);
      S.stats.reviewed++;S.stats.wrong++;
    }
    const dk=todayKey();if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};S.stats.history[dk].reviewed++;if(isCorrect)S.stats.history[dk].correct++;else S.stats.history[dk].wrong++;
    save();
    input.disabled=true;
    setTimeout(()=>{listenState.idx++;listenState.revealed=false;renderListening(c)},1500);
  };
  // Enter key
  input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('listenCheckBtn').click()}};
  // Skip
  document.getElementById('listenSkipBtn').onclick=()=>{
    listenState.idx++;listenState.revealed=false;renderListening(c);
  };
  // Show answer
  document.getElementById('listenShowBtn').onclick=()=>{
    listenState.revealed=true;listenState.wrong++;
    feedback.style.display='block';
    feedback.innerHTML='<div style="color:var(--warning);font-size:1rem">👁 جواب: <strong>'+esc(w.word)+'</strong> = '+esc(w.translation)+'</div>';
    const idx=S.words.findIndex(x=>x.id===w.id);
    if(idx>=0)fsrsNext(S.words[idx],2);
    S.stats.reviewed++;S.stats.wrong++;
    const dk=todayKey();if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};S.stats.history[dk].reviewed++;S.stats.history[dk].wrong++;
    save();
    input.disabled=true;
    setTimeout(()=>{listenState.idx++;listenState.revealed=false;renderListening(c)},1500);
  };
}

function webInitCanvas(c){
  var canvas=document.getElementById('webCanvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var tooltip=document.getElementById('webTooltip');
  var card=document.getElementById('webCard');
  var dpr=window.devicePixelRatio||1;
  var W,H;
  function resizeCanvas(){
    W=canvas.offsetWidth;
    H=webState.fullscreen?window.innerHeight-80:Math.max(500,Math.min(700,window.innerHeight-200));
    canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resizeCanvas();
  var nodes=[],edges=[],hoveredNode=null,dragNode=null,dragOff={x:0,y:0},isPanning=false,panStart={x:0,y:0};
  var selectedIdx=parseInt(document.getElementById('webWordSelect').value)||0;
  // Color palettes
  // High-saturation colors that work with white text
  var catColors=['#6c5ce7','#00897b','#d84315','#6a1b9a','#0277bd','#ad1457','#00838f','#4e342e','#37474f','#283593'];
  var tierColors={1:'#00897b',2:'#6c5ce7',3:'#e65100',0:'#b71c1c'};
  var boxColors=['#b71c1c','#d84315','#e65100','#f57f17','#558b2f','#00897b','#0277bd','#283593','#6a1b9a','#ad1457','#4e342e'];
  // Calculate contrasting text color for a background
  function getTextColor(bg){
    var r=parseInt(bg.slice(1,3),16),g=parseInt(bg.slice(3,5),16),b=parseInt(bg.slice(5,7),16);
    var lum=(0.299*r+0.587*g+0.114*b)/255;
    return lum>0.55?'#1a1a2e':'#ffffff';
  }
  function getNodeColor(n){
    if(n.isCenter)return '#6c5ce7';
    if(webState.colorBy==='tier')return tierColors[n.tier]||'#6c5ce7';
    if(webState.colorBy==='box')return boxColors[Math.min(n.box||0,10)]||'#6c5ce7';
    if(webState.colorBy==='mastery'){
      if(n.mastery>=80)return '#00897b';
      if(n.mastery>=50)return '#e65100';
      if(n.mastery>=20)return '#d84315';
      return '#455a64';
    }
    return catColors[n.catIdx%catColors.length]||'#6c5ce7';
  }
  function buildGraph(){
    nodes=[];edges=[];
    var w=S.words[selectedIdx];
    if(!w)return;
    var cx=W/2+webState.panX,cy=H/2+webState.panY;
    var catIdx=S.categories.indexOf(w.category);
    // Center node
    nodes.push({id:w.id,word:w.word,trans:w.translation||'',x:cx,y:cy,r:42,isCenter:true,tier:getFrequencyTier(w.word),box:w.box,catIdx:catIdx>=0?catIdx:0,mastery:w.reps>0?Math.min(100,Math.round(w.reps*10)):0,defs:w.definitions||[]});
    var synCount=0,antCount=0,famCount=0;
    // Synonyms
    if(webState.showSynonyms){
      (w.synonyms||[]).slice(0,8).forEach(function(s,i){
        var angle=(i/(Math.max(w.synonyms.length,1)))*Math.PI*2-Math.PI/2;
        var dist=160*webState.zoom;
        var sid='syn_'+i;
        nodes.push({id:sid,word:s,trans:'',x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist,r:Math.max(30,28*webState.zoom),tier:getFrequencyTier(s),box:0,catIdx:1,mastery:0,defs:[]});
        edges.push({from:w.id,to:sid,color:'#00b894',label:'مترادف',dash:true});
        synCount++;
      });
    }
    // Antonyms
    if(webState.showAntonyms){
      (w.antonyms||[]).slice(0,6).forEach(function(a,i){
        var total=(webState.showSynonyms?(w.synonyms||[]).length:0)+(w.antonyms||[]).length;
        var angle=((i+(webState.showSynonyms?(w.synonyms||[]).length:0))/Math.max(total,1))*Math.PI*2-Math.PI/2;
        var dist=160*webState.zoom;
        var aid='ant_'+i;
        nodes.push({id:aid,word:a,trans:'',x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist,r:Math.max(30,28*webState.zoom),tier:getFrequencyTier(a),box:0,catIdx:2,mastery:0,defs:[]});
        edges.push({from:w.id,to:aid,color:'#e17055',label:'متضاد',dash:true});
        antCount++;
      });
    }
    // Word family
    if(webState.showFamily){
      var family=getMorphologicalFamily(w.word).slice(0,8);
      family.forEach(function(f,i){
        var angle=(i/family.length)*Math.PI*2+Math.PI/4;
        var dist=240*webState.zoom;
        var fid='fam_'+i;
        nodes.push({id:fid,word:f,trans:'',x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist,r:Math.max(26,22*webState.zoom),tier:getFrequencyTier(f),box:0,catIdx:3,mastery:0,defs:[]});
        edges.push({from:w.id,to:fid,color:'#fdcb6e',label:'خانواده',dash:false});
        famCount++;
      });
    }
    // Definitions as sub-nodes
    if(webState.showDefinitions&&w.definitions&&w.definitions.length){
      w.definitions.slice(0,4).forEach(function(d,i){
        var def=typeof d==='string'?d:(d.definition||'');
        if(!def)return;
        var angle=(i/4)*Math.PI*2+Math.PI/2;
        var dist=300*webState.zoom;
        var did='def_'+i;
        var shortDef=def.length>40?def.slice(0,37)+'...':def;
        nodes.push({id:did,word:shortDef,trans:'',x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist,r:Math.max(24,20*webState.zoom),tier:0,box:0,catIdx:4,mastery:0,defs:[],isDef:true});
        edges.push({from:w.id,to:did,color:'#0984e3',label:'تعریف',dash:true});
      });
    }
    // Update stats
    var statsEl=document.getElementById('webStats');
    if(statsEl)statsEl.innerHTML='<span>🔵 '+nodes.length+' گره</span><span>🔗 '+edges.length+' اتصال</span><span>🔄 '+synCount+' مترادف</span><span>⚡ '+antCount+' متضاد</span><span>🌳 '+famCount+' خانواده</span>';
  }
  // Force-directed layout simulation
  var simRunning=false;
  function simulate(){
    if(!webState.physics||webState.mode==='mindmap'){simRunning=false;return}
    simRunning=true;
    var alpha=0.3;
    for(var iter=0;iter<3;iter++){
      // Repulsion between all nodes
      for(var i=0;i<nodes.length;i++){
        for(var j=i+1;j<nodes.length;j++){
          var dx=nodes[j].x-nodes[i].x;
          var dy=nodes[j].y-nodes[i].y;
          var dist=Math.sqrt(dx*dx+dy*dy)||1;
          var force=2000/(dist*dist);
          var fx=dx/dist*force*alpha;
          var fy=dy/dist*force*alpha;
          if(!nodes[i].isCenter&&!dragNode){nodes[i].x-=fx;nodes[i].y-=fy}
          if(!nodes[j].isCenter&&!dragNode){nodes[j].x+=fx;nodes[j].y+=fy}
        }
      }
      // Attraction along edges
      edges.forEach(function(e){
        var a=nodes.find(function(n){return n.id===e.from});
        var b=nodes.find(function(n){return n.id===e.to});
        if(!a||!b)return;
        var dx=b.x-a.x,dy=b.y-a.y;
        var dist=Math.sqrt(dx*dx+dy*dy)||1;
        var targetDist=webState.mode==='radial'?200*webState.zoom:150*webState.zoom;
        var force=(dist-targetDist)*0.05*alpha;
        var fx=dx/dist*force;
        var fy=dy/dist*force;
        if(!b.isCenter&&dragNode!==b){b.x-=fx;b.y-=fy}
        if(!a.isCenter&&dragNode!==a){a.x+=fx;a.y+=fy}
      });
      // Center gravity
      var cx2=W/2+webState.panX,cy2=H/2+webState.panY;
      nodes.forEach(function(n){
        if(n.isCenter||dragNode===n)return;
        n.x+=(cx2-n.x)*0.01;
        n.y+=(cy2-n.y)*0.01;
      });
      // Boundary clamping
      nodes.forEach(function(n){
        n.x=Math.max(n.r,Math.min(W-n.r,n.x));
        n.y=Math.max(n.r,Math.min(H-n.r,n.y));
      });
    }
    draw();
    if(simRunning)requestAnimationFrame(simulate);
  }
  // Cluster layout
  function applyClusterLayout(){
    var groups={};
    nodes.forEach(function(n){
      if(n.isCenter)return;
      var key=n.catIdx||0;
      if(!groups[key])groups[key]=[];
      groups[key].push(n);
    });
    var groupKeys=Object.keys(groups);
    var cx2=W/2+webState.panX,cy2=H/2+webState.panY;
    groupKeys.forEach(function(gi,idx){
      var angle=(idx/groupKeys.length)*Math.PI*2-Math.PI/2;
      var gDist=180*webState.zoom;
      var gx=cx2+Math.cos(angle)*gDist;
      var gy=cy2+Math.sin(angle)*gDist;
      groups[gi].forEach(function(n,i){
        var a2=(i/groups[gi].length)*Math.PI*2;
        var d2=60*webState.zoom;
        n.x=gx+Math.cos(a2)*d2;
        n.y=gy+Math.sin(a2)*d2;
      });
    });
  }
  function applyTierLayout(){
    var tiers=[[],[],[],[]];
    nodes.forEach(function(n){
      if(n.isCenter)return;
      tiers[n.tier||0].push(n);
    });
    var cx2=W/2+webState.panX,cy2=H/2+webState.panY;
    var labels=['پیشرفته','مفید','رایج','پرکاربرد'];
    tiers.forEach(function(tier,idx){
      var angle=(idx/4)*Math.PI*2-Math.PI/2;
      var gDist=(120+idx*50)*webState.zoom;
      var gx=cx2+Math.cos(angle)*gDist;
      var gy=cy2+Math.sin(angle)*gDist;
      tier.forEach(function(n,i){
        var a2=(i/tier.length)*Math.PI*2;
        var d2=50*webState.zoom;
        n.x=gx+Math.cos(a2)*d2;
        n.y=gy+Math.sin(a2)*d2;
      });
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // Draw grid dots
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--border')||'#2a2e42';
    for(var gx=0;gx<W;gx+=30){for(var gy=0;gy<H;gy+=30){ctx.beginPath();ctx.arc(gx,gy,1,0,Math.PI*2);ctx.fill()}}
    // Draw edges
    edges.forEach(function(e){
      var from=nodes.find(function(n){return n.id===e.from});
      var to=nodes.find(function(n){return n.id===e.to});
      if(!from||!to)return;
      ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);
      ctx.strokeStyle=e.color||'#6c5ce7';
      ctx.lineWidth=e.dash?2:2.5;
      if(e.dash)ctx.setLineDash([5,5]);
      ctx.stroke();ctx.setLineDash([]);
      // Edge label with background
      var mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
      ctx.font='10px Vazirmatn';ctx.textAlign='center';
      var labelW=ctx.measureText(e.label).width+10;
      ctx.fillStyle='rgba(26,29,43,.85)';
      ctx.beginPath();
      if(ctx.roundRect){ctx.roundRect(mx-labelW/2,my-16,labelW,18,4)}
      else{ctx.rect(mx-labelW/2,my-16,labelW,18)}
      ctx.fill();
      ctx.fillStyle='#c8cad8';
      ctx.fillText(e.label,mx,my-4);
    });
    // Draw nodes
    nodes.forEach(function(n){
      var isHovered=hoveredNode===n;
      var col=n.isCenter?'#6c5ce7':getNodeColor(n);
      // Glow for center
      if(n.isCenter){
        ctx.beginPath();ctx.arc(n.x,n.y,n.r+8,0,Math.PI*2);
        ctx.fillStyle='rgba(108,92,231,.15)';ctx.fill();
      }
      // Node circle
      ctx.beginPath();ctx.arc(n.x,n.y,n.r+(isHovered?4:0),0,Math.PI*2);
      ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle=isHovered?'#fff':(n.isCenter?'#a29bfe':col);
      ctx.lineWidth=isHovered?3:1.5;ctx.stroke();
      // Mastery ring
      if(n.mastery>0&&!n.isCenter){
        ctx.beginPath();ctx.arc(n.x,n.y,n.r+2,-Math.PI/2,-Math.PI/2+Math.PI*2*(n.mastery/100));
        ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.stroke();
      }
      // Text with contrasting color
      var textColor=n.isCenter?'#fff':getTextColor(col);
      ctx.fillStyle=textColor;
      ctx.font=(n.isCenter?'bold 14px':n.isDef?'10px':'12px')+' Vazirmatn';
      ctx.textAlign='center';ctx.textBaseline='middle';
      // Text shadow for better readability
      ctx.save();
      ctx.shadowColor=textColor==='#fff'?'rgba(0,0,0,.5)':'rgba(255,255,255,.3)';
      ctx.shadowBlur=3;
      var maxChars=n.isCenter?14:n.r>26?12:n.r>20?9:7;
      var txt=n.word.length>maxChars?n.word.slice(0,maxChars-1)+'…':n.word;
      ctx.fillText(txt,n.x,n.y);
      ctx.restore();
    });
  }
  buildGraph();
  // Initial layout
  if(webState.mode==='cluster')applyClusterLayout();
  else if(webState.mode==='tier')applyTierLayout();
  else if(webState.mode==='radial'){
    nodes.forEach(function(n,i){
      if(n.isCenter)return;
      var angle=(i/nodes.length)*Math.PI*2;
      var dist=180*webState.zoom;
      n.x=W/2+webState.panX+Math.cos(angle)*dist;
      n.y=H/2+webState.panY+Math.sin(angle)*dist;
    });
  }
  draw();
  if(webState.mode==='force')simulate();
  // ── Mouse events ──
  canvas.onmousemove=function(e){
    var rect=canvas.getBoundingClientRect();
    var mx=e.clientX-rect.left,my=e.clientY-rect.top;
    // Transform mouse coords for zoom/pan
    var tmx=(mx-webState.panX),tmy=(my-webState.panY);
    hoveredNode=null;
    for(var ni=0;ni<nodes.length;ni++){
      var n=nodes[ni];
      var dx=mx-n.x,dy=my-n.y;
      if(dx*dx+dy*dy<=n.r*n.r){hoveredNode=n;break}
    }
    canvas.style.cursor=hoveredNode?'pointer':(isPanning?'grabbing':'grab');
    if(hoveredNode){
      tooltip.style.display='block';
      tooltip.style.left=Math.min(mx+12,W-250)+'px';
      tooltip.style.top=(my-50)+'px';
      var tt='<strong style="font-size:1rem">'+esc(hoveredNode.word)+'</strong>';
      if(hoveredNode.trans)tt+='<br><span style="color:var(--success)">'+esc(hoveredNode.trans)+'</span>';
      if(hoveredNode.tier)tt+='<br><span style="font-size:.75rem;color:var(--accent)">📊 '+tierLabel(hoveredNode.tier)+'</span>';
      if(hoveredNode.box)tt+='<br><span style="font-size:.75rem">📦 جعبه '+hoveredNode.box+'</span>';
      if(hoveredNode.mastery)tt+='<br><span style="font-size:.75rem">📈 تسلط '+hoveredNode.mastery+'%</span>';
      tooltip.innerHTML=tt;
    }else{tooltip.style.display='none'}
    if(dragNode){
      dragNode.x=mx-dragOff.x;dragNode.y=my-dragOff.y;
      if(!simRunning)draw();
    }
    if(isPanning&&!dragNode){
      var pdx=mx-panStart.x,pdy=my-panStart.y;
      webState.panX+=pdx;webState.panY+=pdy;
      nodes.forEach(function(n){n.x+=pdx;n.y+=pdy});
      panStart={x:mx,y:my};
      if(!simRunning)draw();
    }
  };
  canvas.onmousedown=function(e){
    var rect=canvas.getBoundingClientRect();
    var mx=e.clientX-rect.left,my=e.clientY-rect.top;
    if(hoveredNode){
      dragNode=hoveredNode;
      dragOff={x:mx-dragNode.x,y:my-dragNode.y};
      canvas.style.cursor='grabbing';
    }else{
      isPanning=true;
      panStart={x:mx,y:my};
      canvas.style.cursor='grabbing';
    }
  };
  canvas.onmouseup=function(){
    dragNode=null;isPanning=false;canvas.style.cursor='grab';
  };
  canvas.onmouseleave=function(){
    dragNode=null;isPanning=false;hoveredNode=null;tooltip.style.display='none';draw();
  };
  // Click node → show word detail
  canvas.onclick=function(e){
    if(dragNode)return;
    if(hoveredNode&&hoveredNode.word){
      var wIdx=S.words.findIndex(function(w){return w.word.toLowerCase()===hoveredNode.word.toLowerCase()});
      if(wIdx>=0){
        webState.selectedWord=wIdx;
        document.getElementById('webWordSelect').value=wIdx;
        buildGraph();
        if(webState.mode==='cluster')applyClusterLayout();
        else if(webState.mode==='tier')applyTierLayout();
        draw();
        if(webState.mode==='force')simulate();
      }else{
        // Word not in library - show lookup
        showWebWordLookup(hoveredNode.word);
      }
    }
  };
  // Zoom with mouse wheel
  canvas.onwheel=function(e){
    e.preventDefault();
    var delta=e.deltaY>0?-0.1:0.1;
    webState.zoom=Math.max(0.3,Math.min(3,webState.zoom+delta));
    buildGraph();
    if(webState.mode==='cluster')applyClusterLayout();
    else if(webState.mode==='tier')applyTierLayout();
    draw();
    if(webState.mode==='force')simulate();
  };
  // ── Button events ──
  c.querySelectorAll('[data-wmode]').forEach(function(btn){
    btn.onclick=function(){
      webState.mode=btn.dataset.wmode;
      webState.physics=webState.mode==='force';
      renderWordWeb(c);
    };
  });
  var colorSel=document.getElementById('webColorBy');
  if(colorSel)colorSel.onchange=function(){webState.colorBy=this.value;draw()};
  var togSyn=document.getElementById('webToggleSyn');
  if(togSyn)togSyn.onclick=function(){webState.showSynonyms=!webState.showSynonyms;renderWordWeb(c)};
  var togAnt=document.getElementById('webToggleAnt');
  if(togAnt)togAnt.onclick=function(){webState.showAntonyms=!webState.showAntonyms;renderWordWeb(c)};
  var togFam=document.getElementById('webToggleFam');
  if(togFam)togFam.onclick=function(){webState.showFamily=!webState.showFamily;renderWordWeb(c)};
  var zoomInBtn=document.getElementById('webZoomIn');
  if(zoomInBtn)zoomInBtn.onclick=function(){webState.zoom=Math.min(3,webState.zoom+0.2);buildGraph();draw();if(webState.mode==='force')simulate()};
  var zoomOutBtn=document.getElementById('webZoomOut');
  if(zoomOutBtn)zoomOutBtn.onclick=function(){webState.zoom=Math.max(0.3,webState.zoom-0.2);buildGraph();draw();if(webState.mode==='force')simulate()};
  var resetBtn=document.getElementById('webReset');
  if(resetBtn)resetBtn.onclick=function(){webState.zoom=1;webState.panX=0;webState.panY=0;buildGraph();draw();if(webState.mode==='force')simulate()};
  var exportBtn=document.getElementById('webExportPng');
  if(exportBtn)exportBtn.onclick=function(){
    var link=document.createElement('a');
    link.download='word-web-'+S.words[selectedIdx].word+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast('تصویر ذخیره شد','success');
  };
  var fsBtn=document.getElementById('webFullscreen');
  if(fsBtn)fsBtn.onclick=function(){
    webState.fullscreen=!webState.fullscreen;
    renderWordWeb(c);
  };
  // Select word
  var select=document.getElementById('webWordSelect');
  select.onchange=function(){
    selectedIdx=parseInt(this.value);
    webState.selectedWord=selectedIdx;
    buildGraph();
    if(webState.mode==='cluster')applyClusterLayout();
    else if(webState.mode==='tier')applyTierLayout();
    draw();
    if(webState.mode==='force')simulate();
  };
  // Search
  var searchInput=document.getElementById('webSearch');
  searchInput.oninput=function(){
    var q=this.value.trim().toLowerCase();
    if(!q)return;
    var idx=S.words.findIndex(function(w){return w.word.toLowerCase().includes(q)||(w.translation||'').toLowerCase().includes(q)});
    if(idx>=0){
      select.value=idx;selectedIdx=idx;
      buildGraph();
      if(webState.mode==='cluster')applyClusterLayout();
      else if(webState.mode==='tier')applyTierLayout();
      draw();
      if(webState.mode==='force')simulate();
    }
  };
  // Keyboard shortcuts
  document.onkeydown=function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='+'||e.key==='='){webState.zoom=Math.min(3,webState.zoom+0.1);buildGraph();draw()}
    else if(e.key==='-'){webState.zoom=Math.max(0.3,webState.zoom-0.1);buildGraph();draw()}
    else if(e.key==='Escape'&&webState.fullscreen){webState.fullscreen=false;renderWordWeb(c)}
  };
}
function showWebWordLookup(word){
  var ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML='<div class="modal" style="max-width:420px">'
    +'<h3 style="margin-bottom:12px">🔍 '+esc(word)+'</h3>'
    +'<p style="color:var(--text2);font-size:.85rem">این کلمه در کتابخانه شما نیست.</p>'
    +'<div id="webLookupBody" style="margin:12px 0"><div class="trans-loading"><div class="trans-spinner"></div>در حال جستجو...</div></div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end">'
    +'<button type="button" class="btn btn-ghost" id="webLookupClose">بستن</button>'
    +'<button type="button" class="btn btn-primary" id="webLookupAdd" disabled>＋ لایتنر</button>'
    +'</div></div>';
  ov.querySelector('#webLookupClose').onclick=function(){ov.remove()};
  document.body.appendChild(ov);
  ov.onclick=function(e){if(e.target===ov)ov.remove()};
  // Fetch word data
  (async function(){
    var dict=await fetchDictionary(word);
    var trans='';
    var body=ov.querySelector('#webLookupBody');
    if(!dict){body.innerHTML='<div style="color:var(--text2);text-align:center;padding:12px">نتیجه‌ای یافت نشد</div>';return}
    var ipa=dict.phoneticBr||dict.phoneticUs||dict.phonetic||'';
    var pos=dict.meanings[0]?dict.meanings[0].partOfSpeech:'';
    var defs=dict.meanings.flatMap(function(m){return m.definitions}).slice(0,3);
    var firstDef=defs[0]?(typeof defs[0]==='string'?defs[0]:defs[0].definition||''):'';
    if(firstDef)trans=await fetchTranslation(firstDef)||'';
    if(!trans)trans=await fetchTranslation(word)||'';
    var h='<div style="text-align:center;margin-bottom:8px">';
    h+='<div style="font-size:1.2rem;font-weight:700;color:var(--accent)">'+esc(word)+'</div>';
    if(ipa)h+='<div style="color:var(--text2);font-size:.85rem">/'+esc(ipa)+'/</div>';
    if(pos)h+='<span class="badge badge-accent">'+esc(pos)+'</span>';
    h+='</div>';
    if(trans)h+='<div style="text-align:center;font-size:1.1rem;font-weight:600;color:var(--success);padding:8px;background:var(--bg);border-radius:10px;margin-bottom:8px">'+esc(trans)+'</div>';
    defs.forEach(function(d){
      var def=typeof d==='string'?d:(d.definition||'');
      h+='<div style="font-size:.83rem;padding:6px 10px;margin-bottom:4px;background:var(--bg);border-radius:8px;border-right:3px solid var(--accent)">'+esc(def)+'</div>';
    });
    body.innerHTML=h;
    var addBtn=ov.querySelector('#webLookupAdd');
    addBtn.disabled=false;
    addBtn.onclick=function(){
      var allDefs=defs.map(function(d){return typeof d==='string'?d:(d.definition||'')});
      S.words.push(createCard({word:word,translation:trans||'',ipa:ipa,partOfSpeech:pos,definitions:allDefs,source:'word-web'}));
      save();toast(word+' اضافه شد','success');ov.remove();renderWordWeb(document.getElementById('content'));
    };
  })();
}

// SMART CALENDAR — تقویم مرور هوشمند
// ═══════════════════════════════════════════
function renderCalendar(c){
  const today=new Date();
  const predictions=[];
  for(let d=0;d<30;d++){
    const date=new Date(today);date.setDate(date.getDate()+d);
    const dateStr=date.toISOString().slice(0,10);
    let count=0;
    S.words.forEach(w=>{
      if(!w.due)return;
      const dueDate=w.due.slice(0,10);
      if(dueDate===dateStr)count++;
    });
    predictions.push({date:dateStr,count,day:date.toLocaleDateString('fa-IR',{weekday:'short'}),num:date.getDate()});
  }
  const totalDue=predictions.reduce((s,p)=>s+p.count,0);
  const maxCount=Math.max(1,...predictions.map(p=>p.count));
  c.innerHTML=`<div style="max-width:700px;margin:0 auto">
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="stat-card"><div class="val" style="color:var(--accent)">${getDue().length}</div><div class="lbl">قابل مرور امروز</div></div>
      <div class="stat-card"><div class="val" style="color:var(--success)">${totalDue}</div><div class="lbl">کل مرور ۳۰ روز</div></div>
      <div class="stat-card"><div class="val" style="color:var(--warning)">${S.words.length}</div><div class="lbl">کل کلمات</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:16px;color:var(--accent)">📅 پیش‌بینی مرور ۳۰ روز آینده</h3>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
        ${predictions.map(p=>{
          const pct=p.count/maxCount;
          const bg=pct>0.7?'var(--danger)':pct>0.3?'var(--warning)':pct>0?'var(--success)':'var(--bg)';
          const isToday=p.date===todayKey();
          return `<div style="text-align:center;padding:8px 4px;border-radius:10px;background:${pct>0?bg:'var(--bg)'};color:${pct>0.3?'#fff':'var(--text)'};border:${isToday?'2px solid var(--accent)':'1px solid var(--border)'};font-size:.75rem;min-height:60px;display:flex;flex-direction:column;justify-content:center">
            <div style="font-size:.65rem;opacity:.7">${p.day}</div>
            <div style="font-weight:700;font-size:.9rem">${p.num}</div>
            <div style="font-size:.7rem;margin-top:2px">${p.count>0?p.count+' کلمه':'—'}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;font-size:.75rem;color:var(--text2)">
        <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--success);display:inline-block"></span> کم</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--warning);display:inline-block"></span> متوسط</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:var(--danger);display:inline-block"></span> زیاد</span>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-bottom:12px;color:var(--accent)">📊 نمودار پیش‌بینی</h3>
      <div style="display:flex;align-items:flex-end;gap:4px;height:150px;padding:10px 0">
        ${predictions.slice(0,14).map(p=>{
          const h=Math.max(4,p.count/maxCount*130);
          const bg=p.count>maxCount*0.7?'var(--danger)':p.count>maxCount*0.3?'var(--warning)':'var(--accent)';
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px">
            <div style="font-size:.6rem;color:var(--text2)">${p.count||''}</div>
            <div style="width:100%;height:${h}px;background:${bg};border-radius:4px 4px 0 0;transition:height .3s"></div>
            <div style="font-size:.55rem;color:var(--text2);writing-mode:vertical-rl;transform:rotate(180deg);height:30px;overflow:hidden">${p.day}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

// DAILY CHALLENGE — چالش روزانه
// ═══════════════════════════════════════════
function getDailyChallenge(){
  const dk=todayKey();
  const history=S.stats.history[dk]||{reviewed:0,correct:0,wrong:0};
  const streak=S.stats.streak||0;
  const dailyGoal=20; // Default daily goal
  const progress=Math.min(100,Math.round(history.reviewed/dailyGoal*100));
  const completed=history.reviewed>=dailyGoal;
  return {history,streak,dailyGoal,progress,completed,reviewed:history.reviewed,correct:history.correct,wrong:history.wrong};
}
// Expose daily challenge in sidebar or as a banner
function renderDailyChallengeWidget(){
  const dc=getDailyChallenge();

    <div style="font-size:.72rem;display:flex;justify-content:space-between;opacity:.9">
      <span>${dc.reviewed}/${dc.dailyGoal} کلمه</span>
      <span>${dc.completed?'✅ تکمیل شد!':'⏳ '+dc.progress+'%'}</span>
    </div>
  </div>`;
}

function checkNotifications(){
  if(!S.settings.notifications)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const due=getDue();
  if(due.length===0)return;
  const now=new Date();
  const timeParts=(S.settings.notificationTime||'09:00').split(':');
  const notifHour=parseInt(timeParts[0])||9;
  const notifMin=parseInt(timeParts[1])||0;
  if(now.getHours()===notifHour&&Math.abs(now.getMinutes()-notifMin)<5){
    const lastNotif=localStorage.getItem('leitner_last_notif');
    if(lastNotif===todayKey())return;
    localStorage.setItem('leitner_last_notif',todayKey());
    new Notification('لایتنر - یادآوری مرور',{
      body:`${due.length} کلمه منتظر مرور شماست!`,
      icon:'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%236c5ce7%27/%3E%3Ctext x=%2750%27 y=%2768%27 text-anchor=%27middle%27 font-size=%2750%27 fill=%27white%27%3E📖%3C/text%3E%3C/svg%3E'
    })}
}

setInterval(checkNotifications,5*60*1000);
