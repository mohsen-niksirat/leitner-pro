<!-- Lazy-loaded: Chart.js, PDF.js, JSZip load on first use -->
<script>
// Lazy loader for heavy dependencies
window._deps={chartjs:null,pdfjs:null,jszip:null};
window._depLoading={};
async function loadDep(name,url,globalCheck){
  if(globalCheck&&globalCheck())return window._deps[name]=true;
  if(window._depLoading[name])return window._depLoading[name];
  window._depLoading[name]=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=url;s.onload=()=>{window._deps[name]=true;resolve()};s.onerror=reject;
    document.head.appendChild(s);
  });
  return window._depLoading[name];
}
function ensureChartJs(){return loadDep('chartjs','https://cdn.jsdelivr.net/npm/chart.js@4',()=>!!window.Chart)}
function ensurePdfJs(){return loadDep('pdfjs','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>!!window.pdfjsLib)}
function ensureJsZip(){return loadDep('jszip','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',()=>!!window.JSZip)}
</script>
<style>

@keyframes transSpin{to{transform:rotate(360deg)}}
.trans-error{color:var(--danger);font-size:.85rem;padding:10px;text-align:center}
.trans-close{position:absolute;top:8px;left:10px;background:none;border:none;color:var(--text2);cursor:pointer;font-size:1rem;padding:4px;line-height:1}
.trans-close:hover{color:var(--danger)}
@media(max-width:768px){.pdf-trans-popup{max-width:calc(100vw - 32px);left:16px!important;right:16px!important}}

/* ═══ ACCESSIBILITY ═══ */
/* High contrast mode */
[data-theme="high-contrast"]{
  --bg:#000;--bg2:#111;--card:#1a1a1a;--card-hover:#222;--border:#555;
  --text:#fff;--text2:#ccc;--accent:#9d8eff;--accent2:#c4b5ff;
  --success:#00e676;--danger:#ff5252;--warning:#ffd740;
  --accent-glow:rgba(157,142,255,.3);
  --shadow:0 4px 24px rgba(0,0,0,.8);
}
[data-theme="high-contrast"] .btn{border:1px solid var(--border)}
[data-theme="high-contrast"] .input{border:2px solid var(--border)}
[data-theme="high-contrast"] .nav-btn.active{border:2px solid var(--accent)}

/* Font size scale */
html[data-fontsize="small"]{font-size:14px}
html[data-fontsize="normal"]{font-size:16px}
html[data-fontsize="large"]{font-size:18px}
html[data-fontsize="xlarge"]{font-size:20px}

/* Skip to content link */
.skip-link{position:absolute;top:-100px;left:16px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;font-size:.9rem;text-decoration:none;transition:top .2s}
.skip-link:focus{top:16px}

/* Screen reader only */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Focus trap for modals */
.modal-overlay:focus-within .modal{outline:2px solid var(--accent);outline-offset:2px}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
  .review-inner{transition:none}
}
.import-steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:24px;flex-wrap:wrap}
.import-step-dot{width:38px;height:38px;border-radius:50%;background:var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;transition:all .4s cubic-bezier(.4,0,.2,1);flex-shrink:0}
.import-step-dot.active{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;box-shadow:0 0 0 4px rgba(108,92,231,.25),0 4px 16px rgba(108,92,231,.35);transform:scale(1.1)}
.import-step-dot.done{background:linear-gradient(135deg,var(--success),#00d2a0);color:#fff;box-shadow:0 2px 8px rgba(0,184,148,.3)}
.import-step-line{width:32px;height:2px;background:var(--border);flex-shrink:0}
.import-step-line.done{background:var(--success)}
.import-step-label{font-size:.65rem;color:var(--text2);text-align:center;margin-top:4px;white-space:nowrap}
.import-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.import-stat{text-align:center;padding:14px 10px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);transition:all .3s}
.import-stat:hover{border-color:var(--accent);transform:translateY(-2px)}
.import-stat .val{font-size:1.6rem;font-weight:800;color:var(--accent);line-height:1.2}
.import-stat .lbl{font-size:.7rem;color:var(--text2);margin-top:4px}
.import-filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.import-filter-bar label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text2);cursor:pointer;transition:color .2s}
.import-filter-bar label:hover{color:var(--text)}
.import-filter-bar input[type="radio"]{accent-color:var(--accent);width:16px;height:16px}
.import-word-grid{max-height:400px;overflow-y:auto;display:grid;gap:4px;margin-bottom:16px}
.import-word-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--bg);cursor:pointer;transition:all .2s;border:1px solid transparent}
.import-word-item:hover{border-color:var(--accent);background:var(--accent-glow)}
.import-word-item.existing{opacity:.5}
.import-word-item input[type="checkbox"]{accent-color:var(--accent)}
.import-review-wrap{max-height:450px;overflow-y:auto}
.import-review-table{width:100%;border-collapse:collapse;font-size:.85rem}
.import-review-table th{padding:8px 10px;text-align:right;border-bottom:2px solid var(--border);color:var(--text2);font-size:.75rem;position:sticky;top:0;background:var(--card)}
.import-review-table td{padding:6px 10px;border-bottom:1px solid var(--border)}
.import-review-table input[type="text"]{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:.85rem;transition:all .25s}
.import-review-table input[type="text"]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.import-review-table input[type="checkbox"]{accent-color:var(--accent)}
.import-progress-card{text-align:center;padding:48px 24px}
.import-progress-bar{width:100%;max-width:400px;margin:18px auto}
.import-done-card{text-align:center;padding:36px;max-width:500px;margin:0 auto}

/* ═══════════════════════════════════════════
   HEATMAP & FORECAST (Stats)
   ═══════════════════════════════════════════ */
.heatmap{display:grid;grid-template-columns:repeat(53,1fr);gap:3px;margin:14px 0}
.heatmap-cell{width:100%;aspect-ratio:1;border-radius:3px;background:var(--bg);cursor:default;position:relative;transition:all .2s}
.heatmap-cell:hover{transform:scale(1.3);z-index:2}
.heatmap-cell[data-count]:hover::after{content:attr(data-count);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:2px 6px;border-radius:4px;font-size:.65rem;white-space:nowrap;z-index:10}
.heatmap-l0{background:var(--bg)!important}.heatmap-l1{background:rgba(0,184,148,.2)!important}.heatmap-l2{background:rgba(0,184,148,.4)!important}.heatmap-l3{background:rgba(0,184,148,.6)!important}.heatmap-l4{background:rgba(0,184,148,.85)!important}
.heatmap-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:.7rem;color:var(--text2);margin-top:8px}
.heatmap-legend-cell{width:12px;height:12px;border-radius:2px}

/* ═══════════════════════════════════════════
   FREQUENCY TIER BADGES
   ═══════════════════════════════════════════ */
.tier-1{background:rgba(0,184,148,.2);color:var(--success);border:1px solid rgba(0,184,148,.25)}
.tier-2{background:rgba(108,92,231,.15);color:var(--accent);border:1px solid rgba(108,92,231,.2)}
.tier-3{background:rgba(253,203,110,.15);color:var(--warning);border:1px solid rgba(253,203,110,.2)}
.tier-0{background:rgba(225,112,85,.1);color:var(--danger);border:1px solid rgba(225,112,85,.15)}

/* ═══════════════════════════════════════════
   CONTEXT SENTENCE
   ═══════════════════════════════════════════ */
.context-sentence{font-size:.8rem;color:var(--text2);font-style:italic;margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:12px;border-right:3px solid var(--accent);line-height:1.6;text-align:right}
.pdf-canvas-page{position:relative;display:inline-block}
.pdf-canvas-textlayer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;opacity:1;line-height:1.0;pointer-events:auto;cursor:text}
.pdf-canvas-textlayer>div{position:absolute;white-space:pre;color:transparent;transform-origin:0% 0%}
.pdf-canvas-textlayer span{color:transparent;cursor:text;position:relative}
.pdf-canvas-textlayer span::selection{background:rgba(108,92,231,.4)}
.pdf-canvas-textlayer span::-moz-selection{background:rgba(108,92,231,.4)}
.pdf-canvas-textlayer ::selection{background:rgba(108,92,231,.4)}
.pdf-search-match{background:rgba(253,203,110,.2)!important;border-radius:8px;transition:background .3s}
.pdf-search-found{background:rgba(253,203,110,.5);padding:2px;border-radius:3px}

/* ═══════════════════════════════════════════
   QUIZ TYPES
   ═══════════════════════════════════════════ */
.quiz-type-bar{display:flex;gap:6px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}.quiz-type-bar .btn-sm{font-size:.75rem;padding:6px 10px}
.quiz-input{width:100%;padding:16px;border:2px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font:inherit;font-size:1.1rem;text-align:center;transition:all .25s}
.quiz-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}

/* ═══════════════════════════════════════════
   OFFLINE INDICATOR
   ═══════════════════════════════════════════ */
.offline-banner{background:linear-gradient(90deg,var(--warning),#f0c040);color:#000;text-align:center;padding:8px;font-size:.82rem;font-weight:600;display:none;letter-spacing:.02em}
.offline-banner.visible{display:block}
.eng-quiz-frame{width:100%;height:calc(100vh - 140px);min-height:600px;border:none;border-radius:var(--radius);background:var(--card)}
/* TEXT SELECTION INPUT */
.text-selectable{line-height:2.4;direction:ltr;text-align:left;font-size:1rem;user-select:none;-webkit-user-select:none}
.text-word{display:inline-block;padding:2px 5px;margin:1px;border-radius:6px;cursor:pointer;transition:all .2s;border:1px solid transparent;color:var(--text)}
.text-word:hover{background:var(--accent-glow);border-color:var(--accent)}
.text-word.selected{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(108,92,231,.3)}
.translated-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);margin-bottom:6px;transition:all .2s}
.translated-item:hover{border-color:var(--accent)}
.translated-item input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.translated-item .tw{font-weight:600;min-width:80px;direction:ltr}
.translated-item .tt{color:var(--success);flex:1;font-weight:500}
.translated-item.moved{opacity:.5;border-color:var(--success)}
.translated-item.moved .tw{text-decoration:line-through}
.sel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}

/* ═══════════════════════════════════════════
   READING MODE - UPGRADED
   ═══════════════════════════════════════════ */
.reading-upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all .3s;background:var(--bg)}
.reading-upload-zone:hover,.reading-upload-zone.dragover{border-color:var(--accent);background:var(--accent-glow)}
.reading-upload-zone .icon{font-size:2.5rem;margin-bottom:12px;opacity:.6}
.reading-upload-zone p{color:var(--text2);font-size:.85rem;margin-top:8px}
.reading-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px;background:var(--card);border-radius:var(--radius);margin-bottom:18px;border:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.reading-toolbar .btn{padding:8px 14px;font-size:.8rem;border-radius:10px}
.reading-toolbar .btn.active{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff}
.reading-toolbar .sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.reading-toolbar .search-box{padding:7px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:.8rem;width:160px;transition:all .25s}
.reading-toolbar .search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.reading-page-info{color:var(--text2);font-size:.82rem;min-width:60px;text-align:center}
.reading-progress-bar{width:100%;height:4px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:4px}
.reading-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s}
.reading-dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.reading-doc-card{text-align:center;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);transition:all .3s}
.reading-doc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.reading-doc-card .val{font-size:1.6rem;font-weight:800;color:var(--accent);line-height:1.2}
.reading-doc-card .lbl{font-size:.7rem;color:var(--text2);margin-top:4px}
.reading-content-area{line-height:2.2;font-size:1.05rem;direction:ltr;text-align:left;padding:20px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);min-height:200px;max-height:70vh;overflow-y:auto;scroll-behavior:smooth}
.reading-content-area .reading-word{display:inline;padding:1px 3px;border-radius:4px;cursor:pointer;transition:all .2s;border-bottom:2px solid var(--accent)}
.reading-content-area .reading-word:hover{background:var(--accent-glow)}
.reading-content-area .reading-word.known{border-bottom-color:var(--success)}
.reading-content-area .reading-word.repeated{border-bottom-color:var(--warning)}
.reading-content-area .reading-word.search-match{background:rgba(253,203,110,.25);border-radius:3px}
.reading-content-area .reading-word.selected-word{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;border-radius:4px;padding:1px 5px}
.reading-page-marker{display:flex;align-items:center;gap:8px;margin:16px 0 10px;padding:8px 14px;background:var(--bg);border-radius:10px;font-size:.82rem;color:var(--text2);border-right:3px solid var(--accent)}
.reading-page-marker strong{color:var(--accent);font-size:.9rem}
.reading-page-summary{padding:14px;background:var(--bg);border-radius:12px;border:1px solid var(--border);margin-bottom:12px}
.reading-page-summary h4{font-size:.85rem;font-weight:700;color:var(--accent);margin-bottom:8px}
.reading-page-summary .stats-row{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--text2)}
.reading-page-summary .stats-row span{display:flex;align-items:center;gap:3px}
.reading-page-summary .top-words{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.reading-page-summary .top-word-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.7rem;background:rgba(108,92,231,.12);color:var(--accent);border:1px solid rgba(108,92,231,.2)}
.reading-vocab-panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:18px;max-height:70vh;overflow-y:auto}
.reading-vocab-panel h3{font-size:.95rem;font-weight:700;color:var(--accent);margin-bottom:12px}
.reading-vocab-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.reading-vocab-item:hover{background:var(--accent-glow);border-color:var(--accent)}
.reading-vocab-item .word{font-weight:600;min-width:80px;font-size:.88rem}
.reading-vocab-item .count{font-size:.75rem;color:var(--text2);min-width:30px;text-align:center}
.reading-vocab-item .badge-sm{font-size:.65rem;padding:2px 6px;border-radius:6px}
.reading-word-detail{position:fixed;z-index:310;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 48px rgba(0,0,0,.5);display:none;width:400px;min-width:280px;min-height:200px;max-height:85vh;overflow:auto;backdrop-filter:blur(12px);font-family:var(--font);direction:ltr;text-align:left;resize:both;user-select:none}
.reading-word-detail.visible{display:flex;flex-direction:column}
.reading-word-detail .wd-drag-handle{display:flex;align-items:center;gap:6px;padding:10px 14px;cursor:move;background:var(--bg);border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;flex-shrink:0}
.reading-word-detail .wd-drag-handle .wd-drag-dots{color:var(--text2);font-size:.7rem;letter-spacing:2px;user-select:none}
.reading-word-detail .wd-body{padding:14px;flex:1;overflow-y:auto;direction:ltr;text-align:left}
.reading-word-detail .wd-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.reading-word-detail .wd-word{font-size:1.3rem;font-weight:700}
.reading-word-detail .wd-ipa{font-size:.85rem;color:var(--text2)}
.reading-word-detail .wd-occ{font-size:.75rem;padding:2px 8px;border-radius:8px;background:rgba(108,92,231,.12);color:var(--accent)}
.reading-word-detail .wd-persian{font-size:1.05rem;font-weight:600;color:var(--success);margin-bottom:6px;font-family:var(--font);direction:rtl;text-align:right}
.reading-word-detail .wd-defs{margin-bottom:8px}
.reading-word-detail .wd-def{font-size:.83rem;color:var(--text);margin-bottom:4px;line-height:1.5}
.reading-word-detail .wd-def::before{content:'• ';color:var(--accent)}
.reading-word-detail .wd-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reading-heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:4px;margin:12px 0}
.reading-heatmap-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--text2);cursor:default;transition:all .2s;border:1px solid var(--border)}
.reading-heatmap-cell:hover{transform:scale(1.15);z-index:2}
.reading-filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.reading-filter-bar .btn{font-size:.75rem;padding:6px 10px}
.reading-export-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
@media(max-width:768px){.reading-toolbar{gap:3px;padding:8px}.reading-toolbar .btn{padding:6px 10px;font-size:.75rem;min-width:36px;min-height:36px}.reading-toolbar .search-box{width:120px;font-size:.75rem}.reading-dashboard{grid-template-columns:repeat(2,1fr)}.reading-content-area{font-size:.95rem;padding:14px;max-height:60vh}.reading-vocab-panel{max-height:50vh}}

/* ═══════════════════════════════════════════
   RICH BACK CARD SECTIONS
   ═══════════════════════════════════════════ */
.rb-header{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rb-word{font-size:1.6rem;font-weight:800;color:var(--text)}
.rb-ipa{font-size:.85rem;color:var(--text2)}
.rb-pos{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;background:rgba(108,92,231,.15);color:var(--accent);border:1px solid rgba(108,92,231,.2)}
.rb-translation{font-size:1.35rem;font-weight:700;color:var(--success);text-align:center;margin-bottom:16px;line-height:1.6}
.rb-core-meaning{font-size:.9rem;color:var(--text);text-align:center;margin-bottom:14px;padding:8px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--border)}
.rb-section{margin-bottom:12px;text-align:right}
.rb-section-label{font-size:.7rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.rb-section-label .icon{font-size:.8rem}
.rb-section-content{font-size:.83rem;color:var(--text);line-height:1.7}
.rb-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.rb-chip{display:inline-block;padding:3px 10px;border-radius:10px;font-size:.72rem;background:var(--bg);color:var(--text2);border:1px solid var(--border);transition:all .2s}
.rb-chip:hover{border-color:var(--accent);color:var(--text)}
.rb-chip.antonym{background:rgba(225,112,85,.1);color:var(--danger);border-color:rgba(225,112,85,.2)}
.rb-chip.word-family{background:rgba(108,92,231,.1);color:var(--accent2);border-color:rgba(108,92,231,.2)}
.rb-example{font-size:.8rem;color:var(--text2);font-style:italic;padding:6px 10px;margin-bottom:6px;background:var(--bg);border-radius:8px;border-right:3px solid var(--accent);line-height:1.6}
.rb-context{font-size:.82rem;color:var(--text2);padding:8px 12px;background:var(--bg);border-radius:10px;border-right:3px solid var(--warning);line-height:1.6;margin-bottom:12px}
.rb-note-box{font-size:.8rem;padding:8px 12px;background:rgba(0,184,148,.08);border:1px solid rgba(0,184,148,.2);border-radius:10px;color:var(--text);line-height:1.6;margin-bottom:12px;border-right:3px solid var(--success)}
.rb-trap-box{font-size:.8rem;padding:8px 12px;background:rgba(253,203,110,.1);border:1px solid rgba(253,203,110,.25);border-radius:10px;color:var(--text);line-height:1.6;margin-bottom:12px;border-right:3px solid var(--warning)}
.rb-footer{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.rb-footer .tag{font-size:.65rem}
.rb-source{font-size:.65rem;color:var(--text2);padding:2px 8px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
@media(max-width:768px){.rb-word{font-size:1.3rem}.rb-translation{font-size:1.15rem}.rb-chip{font-size:.68rem;padding:2px 8px}}

/* ═══════════════════════════════════════════
   EDIT MODAL ADVANCED SECTION
   ═══════════════════════════════════════════ */

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const MS_PER_DAY=86400000;
const PDF_DEFAULT_SCALE=1.5;
const PDF_THUMB_SCALE=0.2;
const FSRS_DECAY_COEFF=0.5;
const LIST_PAGE_SIZE=50;

// ═══════════════════════════════════════════
// STATE & STORAGE
// ═══════════════════════════════════════════
const LS_KEY='leitner_v2';
const LS_BACKUP_KEY='leitner_backup';
const SCHEMA_VERSION=3;

// ═══ IndexedDB Storage — unlimited, offline ═══
const IDB_NAME='leitnerDB';
const IDB_STORE='data';
let _db=null;

function openDB(){
  return new Promise(function(resolve,reject){
    if(_db){resolve(_db);return}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(e){
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
    };
    req.onsuccess=function(e){_db=e.target.result;resolve(_db)};
    req.onerror=function(e){reject(e.target.error)};
  });
}

function idbPut(key,value){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(value,key);
      tx.oncomplete=function(){resolve()};
      tx.onerror=function(e){reject(e.target.error)};
    });
  });
}

function idbGet(key){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get(key);
      req.onsuccess=function(){resolve(req.result)};
      req.onerror=function(e){reject(e.target.error)};
    });
  });
}
function defaultState(){return{words:[],longTerm:[],stats:{reviewed:0,correct:0,wrong:0,streak:0,xp:0,lastReviewDate:null,history:{}},quizStats:{sessions:[],totalCorrect:0,totalWrong:0,wordPerformance:{},currentSession:null},categories:['پیش‌'],settings:{theme:'dark',sourceLang:'en',targetLang:'fa',notifications:false,notificationTime:'09:00',sidebarLocked:false,aiChat:{provider:'gemini',model:'gemini-2.0-flash',apiKey:'',apiKeys:{gemini:'',openrouter:'',groq:''},systemPrompt:'',temperature:0.7,maxTokens:2048,dailyLimit:250,dailyUsage:0,dailyUsageDate:'',connectionStatus:'disconnected',lastError:'',messages:[],chats:[],activeChat:null,providerUsage:null}},_version:SCHEMA_VERSION}}
let S=loadState(); // Quick sync load from localStorage
// Then async load from IndexedDB (bigger, offline)
loadFromIDB().then(function(idbData){
  if(idbData&&idbData.words&&idbData.words.length>=S.words.length){
    // IndexedDB has more data — use it
    const s={...defaultState(),...idbData};
    s.words=(idbData.words||[]).map(sanitizeCard).filter(w=>w.word);
    s.longTerm=(idbData.longTerm||[]).map(sanitizeCard).filter(w=>w.word);
    s.stats={...defaultState().stats,...(idbData.stats||{})};
    s.quizStats={...defaultState().quizStats,...(idbData.quizStats||{})};
    s.settings={...defaultState().settings,...(idbData.settings||{})};
    S=s;
    rebuildIndex();
    if(typeof render==='function')render();
  } else if(idbData&&idbData.words&&idbData.words.length>0&&S.words.length===0){
    // localStorage empty but IDB has data
    const s={...defaultState(),...idbData};
    s.words=(idbData.words||[]).map(sanitizeCard).filter(w=>w.word);
    s.longTerm=(idbData.longTerm||[]).map(sanitizeCard).filter(w=>w.word);
    S=s;
    rebuildIndex();
    if(typeof render==='function')render();
  } else if(S.words.length>0){
    // localStorage has data — migrate to IDB
    save();
  }
}).catch(function(){});

function sanitizeCard(c){
  return{id:String(c.id||uid()),word:String(c.word||'').trim(),translation:String(c.translation||'').trim(),ipa:String(c.ipa||'').trim(),category:String(c.category||'پیش‌فرض').trim(),favorite:!!c.favorite,context:String(c.context||'').trim(),
  box:Math.max(0,Math.min(10,Number(c.box)||0)),repetitions:Math.max(0,Number(c.repetitions)||0),interval:Math.max(1,Number(c.interval)||1),easeFactor:Math.max(1.3,Number(c.easeFactor)||2.5),
  addedDate:c.addedDate||new Date().toISOString(),nextReviewDate:c.nextReviewDate||null,lastReviewedAt:c.lastReviewedAt||null,
  // FSRS fields
  stability:Number(c.stability)||0,difficulty:Number(c.difficulty)||0,elapsedDays:Number(c.elapsedDays)||0,scheduledDays:Number(c.scheduledDays)||0,reps:Number(c.reps)||0,lapses:Number(c.lapses)||0,fsrsState:String(c.fsrsState||'new'),
  // Dictionary details
  definitions:Array.isArray(c.definitions)?c.definitions:[],examples:Array.isArray(c.examples)?c.examples:[],synonyms:Array.isArray(c.synonyms)?c.synonyms:[],partOfSpeech:String(c.partOfSpeech||'').trim(),audioUs:String(c.audioUs||'').trim(),audioBr:String(c.audioBr||'').trim(),
  // Rich vocabulary fields
  coreMeaning:String(c.coreMeaning||'').trim(),collocations:Array.isArray(c.collocations)?c.collocations:[],antonyms:Array.isArray(c.antonyms)?c.antonyms:[],wordFamily:Array.isArray(c.wordFamily)?c.wordFamily:[],note:String(c.note||'').trim(),trap:String(c.trap||'').trim(),tags:Array.isArray(c.tags)?c.tags:[],source:String(c.source||'').trim()}
}

function loadState(){try{const d=localStorage.getItem(LS_KEY);if(!d)return defaultState();const p=JSON.parse(d);const s={...defaultState(),...p};s.words=(p.words||[]).map(sanitizeCard).filter(w=>w.word);s.longTerm=(p.longTerm||[]).map(sanitizeCard).filter(w=>w.word);s.stats={...defaultState().stats,...(p.stats||{})};if(Array.isArray(s.stats.history))s.stats.history={};s.quizStats={...defaultState().quizStats,...(p.quizStats||{})};if(!s.quizStats.wordPerformance)s.quizStats.wordPerformance={};if(!s.quizStats.sessions)s.quizStats.sessions=[];s.settings={...defaultState().settings,...(p.settings||{})};if(!s.settings.aiChat)s.settings.aiChat=defaultState().settings.aiChat;else{s.settings.aiChat={...defaultState().settings.aiChat,...s.settings.aiChat};if(!s.settings.aiChat.apiKeys)s.settings.aiChat.apiKeys={gemini:'',openrouter:'',groq:''};if(s.settings.aiChat.apiKey&&s.settings.aiChat.apiKeys[s.settings.aiChat.provider]===''){s.settings.aiChat.apiKeys[s.settings.aiChat.provider]=s.settings.aiChat.apiKey};if(!s.settings.aiChat.chats)s.settings.aiChat.chats=[];if(!s.settings.aiChat.activeChat)s.settings.aiChat.activeChat=null};return s}catch(e){return defaultState()}}
// Debounced save — batches rapid writes into one localStorage flush
let _saveTimer=null,_saveDirty=false;
function save(){
  _saveDirty=true;
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(_doSave,500);
}
function _doSave(){
  _saveTimer=null;if(!_saveDirty)return;
  _saveDirty=false;
  idbPut('state',S).then(function(){
    rebuildIndex();autoBackup();
    // Also save slim version to localStorage as fallback
    try{localStorage.setItem(LS_KEY+'_meta',JSON.stringify({words:S.words.length,longTerm:S.longTerm.length,lastSave:Date.now()}))}catch(e){}
  }).catch(function(e){
    toast('خطای ذخیره‌سازی: '+e.message,'error');
    // Fallback to localStorage
    try{localStorage.setItem(LS_KEY,JSON.stringify(S));rebuildIndex()}catch(e2){toast('حافظه پر است','error')}
  });
}

function saveForce(){
  return idbPut('state',S).then(function(){return true}).catch(function(){
    try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true}catch(e){return false}
  });
}

function loadFromIDB(){
  return idbGet('state').then(function(data){
    if(data)return data;
    // Fallback: try localStorage
    try{
      const d=localStorage.getItem(LS_KEY);
      if(d)return JSON.parse(d);
    }catch(e){}
    return null;
  });
}

// Force immediate save (for critical paths like page unload)
function saveNow(){
  if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null}
  _saveDirty=false;
  // Try synchronous localStorage as fallback for unload
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));rebuildIndex()}catch(e){}
  // Also try async IDB (may not complete on unload, but worth trying)
  try{idbPut('state',S)}catch(e){}
}
// Warn on page close if there are unsaved changes
window.addEventListener('beforeunload',()=>{if(_saveDirty||_saveTimer){saveNow()}});
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtDate(d){if(!d)return'-';return new Date(d).toLocaleDateString('fa-IR')}
function todayKey(){return new Date().toISOString().slice(0,10)}

// ═══════════════════════════════════════════
// ERROR BOUNDARY HELPER
// ═══════════════════════════════════════════
function withErrorBoundary(fn, fallback) {
  return function() {
    try {
      return fn.apply(this, arguments);
    } catch (err) {
      console.error('[ErrorBoundary]', err);
      if (typeof toast === 'function') {
        toast('خطا در اجرای بخش: ' + (err.message || 'ناشناخته'), 'error');
      }
      if (fallback) {
        try {
          return fallback.apply(this, arguments);
        } catch (e2) {
          console.error('[ErrorBoundary fallback]', e2);
        }
      }
      // Return minimal safe HTML
      var c = arguments[0];
      if (c && c.innerHTML !== undefined) {
        c.innerHTML = '<div class="card" style="text-align:center;padding:40px"><div class="empty"><div class="icon">⚠️</div><p>خطا در نمایش این بخش</p><p style="font-size:.8rem;color:var(--text2);margin-top:8px">' + esc(err.message || '') + '</p><button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="location.reload()">بازنشانی صفحه</button></div></div>';
      }
    }
  };
}

// ═══════════════════════════════════════════
// CARD FACTORY
// ═══════════════════════════════════════════
function createCard(overrides){
  return sanitizeCard(Object.assign({
    id:uid(),word:'',translation:'',ipa:'',category:'پیش‌فرض',
    favorite:false,context:'',
    box:0,repetitions:0,interval:1,easeFactor:2.5,
    addedDate:new Date().toISOString(),nextReviewDate:null,lastReviewedAt:null,
    stability:0,difficulty:0,elapsedDays:0,scheduledDays:0,
    reps:0,lapses:0,fsrsState:'new',
    definitions:[],examples:[],synonyms:[],partOfSpeech:'',
    audioUs:'',audioBr:'',
    coreMeaning:'',collocations:[],antonyms:[],wordFamily:[],
    note:'',trap:'',tags:[],source:''
  },overrides||{}))}

// ═══════════════════════════════════════════
// WORD LOOKUP INDEX (O(1) existence checks)
// ═══════════════════════════════════════════
let _wordsSet=null,_ltSet=null;
function rebuildIndex(){
  _wordsSet=new Set(S.words.map(function(w){return w.word.toLowerCase()}));
  _ltSet=new Set(S.longTerm.map(function(w){return w.word.toLowerCase()}))}
function wordExists(word){
  if(!_wordsSet)rebuildIndex();
  var w=word.toLowerCase();
  return _wordsSet.has(w)||_ltSet.has(w)}

// ═══════════════════════════════════════════
// STATE SNAPSHOT IMPORT/EXPORT HELPERS
// ═══════════════════════════════════════════
function sanitizeStateSnapshot(raw){
  if(!raw||typeof raw!=='object')return null;
  const s={...defaultState()};
  // Detect format
  const isFullSnapshot=raw.schema==='leitner-full-backup'||(Array.isArray(raw.words)&&(Array.isArray(raw.longTerm)||raw.longTerm===undefined));
  if(isFullSnapshot){
    s.words=(raw.words||[]).map(sanitizeCard).filter(w=>w.word);
    s.longTerm=(raw.longTerm||[]).map(sanitizeCard).filter(w=>w.word);
    if(raw.stats&&typeof raw.stats==='object'&&!Array.isArray(raw.stats)){
      s.stats={...defaultState().stats,...raw.stats};
      if(Array.isArray(s.stats.history))s.stats.history={};
    }
    if(Array.isArray(raw.categories))s.categories=raw.categories.filter(c=>typeof c==='string'&&c.trim());
    if(raw.settings&&typeof raw.settings==='object')s.settings={...defaultState().settings,...raw.settings};
    if(raw._version||raw.version)s._version=raw._version||raw.version;
    return{s,isFull:true};
  }
  // Legacy format: just words array or {words:[...]}
  let cards=[];
  if(Array.isArray(raw))cards=raw.filter(w=>w&&typeof w.word==='string'&&w.word.trim());
  else if(Array.isArray(raw.words))cards=raw.words.filter(w=>w&&typeof w.word==='string'&&w.word.trim());
  if(!cards.length)return null;
  return{cards,isFull:false};
}

function exportStateSnapshot(){
  return JSON.stringify({
    schema:'leitner-full-backup',
    version:SCHEMA_VERSION,
    exportedAt:new Date().toISOString(),
    words:S.words,
    longTerm:S.longTerm,
    stats:S.stats,
    categories:S.categories,
    settings:S.settings
  },null,2);
}

function importStateSnapshot(data){
  const result=sanitizeStateSnapshot(data);
  if(!result)return{ok:false,msg:'ساختار فایل معتبر نیست'};
  let allCards=[];
  if(result.isFull){
    allCards=[...(result.s.words||[]),...(result.s.longTerm||[])];
    if(result.s.categories&&result.s.categories.length){result.s.categories.forEach(c=>{if(!S.categories.includes(c))S.categories.push(c)})}
    if(result.s.settings)S.settings={...S.settings,...result.s.settings};
  }else{
    allCards=result.cards||[];
  }
  const staged=stageImportCards(allCards,'json');
  if(staged)return{ok:true,staged:true};
  return{ok:true,msg:'همه تکراری بودند'};
}

// ═══════════════════════════════════════════
// SHARED DECK FORMAT (lightweight, shareable)
// ═══════════════════════════════════════════
function exportSharedDeck(category){
  const words=S.words.filter(w=>!category||w.category===category);
  if(!words.length)return null;
  // Lightweight format: only essential fields
  const deck={
    v:1,
    name:category||'همه کلمات',
    lang:S.settings.sourceLang||'en',
    target:S.settings.targetLang||'fa',
    count:words.length,
    words:words.map(w=>({
      w:w.word,
      t:w.translation,
      ipa:w.ipa||undefined,
      pos:w.partOfSpeech||undefined,
      def:w.definitions&&w.definitions.length?w.definitions[0]:undefined,
      ex:w.examples&&w.examples.length?w.examples[0]:undefined,
      syn:w.synonyms&&w.synonyms.length?w.synonyms.slice(0,3):undefined,
      ant:w.antonyms&&w.antonyms.length?w.antonyms.slice(0,2):undefined
    }))
  };
  return deck;
}

function exportSharedDeckJSON(category){
  const deck=exportSharedDeck(category);
  if(!deck)return null;
  return JSON.stringify(deck);
}

function exportSharedDeckLink(category){
  const json=exportSharedDeckJSON(category);
  if(!json)return null;
  try{
    const encoded=btoa(unescape(encodeURIComponent(json)));
    const baseUrl=location.href.split('#')[0].split('?')[0];
    return baseUrl+'#deck='+encoded.slice(0,2000); // URL length limit
  }catch(e){return null}
}

function importSharedDeck(deck){
  if(!deck||!deck.words||!Array.isArray(deck.words))return{ok:false,msg:'ساختار دسته معتبر نیست'};
  let added=0,skipped=0;
  deck.words.forEach(item=>{
    const word=String(item.w||'').trim().toLowerCase();
    if(!word||wordExists(word)){skipped++;return}
    S.words.push(createCard({
      word:item.w,
      translation:item.t||'',
      ipa:item.ipa||'',
      partOfSpeech:item.pos||'',
      definitions:item.def?[item.def]:[],
      examples:item.ex?[item.ex]:[],
      synonyms:item.syn||[],
      antonyms:item.ant||[],
      category:deck.name||'مشترک',
      source:'shared-deck'
    }));
    added++;
  });
  save();
  return{ok:true,msg:`${added} کلمه از دسته «${deck.name||'مشترک'}» اضافه شد${skipped?` (${skipped} تکراری رد شد)`:''}`};
}

// Check URL hash for shared deck on load
function checkSharedDeckHash(){
  const hash=location.hash;
  if(!hash.startsWith('#deck='))return;
  try{
    const encoded=hash.slice(6);
    const json=decodeURIComponent(escape(atob(encoded)));
    const deck=JSON.parse(json);
    if(deck&&deck.words){
      const result=importSharedDeck(deck);
      if(result.ok){
        toast(result.msg,'success');
        // Clear hash to avoid re-import on refresh
        history.replaceState(null,'',location.pathname+location.search);
      }
    }
  }catch(e){toast('خطا در خواندن دسته مشترک','error')}
}

// ═══════════════════════════════════════════
// LEADERBOARD (anonymous, localStorage)
// ═══════════════════════════════════════════
const LEADERBOARD_KEY='leitner_leaderboard';
const PLAYER_ID_KEY='leitner_player_id';

function getPlayerId(){
  let id=localStorage.getItem(PLAYER_ID_KEY);
  if(!id){id='player_'+uid();localStorage.setItem(PLAYER_ID_KEY,id)}
  return id;
}

function submitScore(){
  const lb=JSON.parse(localStorage.getItem(LEADERBOARD_KEY)||'[]');
  const playerId=getPlayerId();
  const existing=lb.findIndex(e=>e.id===playerId);
  const entry={
    id:playerId,
    xp:S.stats.xp,
    words:S.words.length+S.longTerm.length,
    accuracy:S.stats.reviewed>0?Math.round(S.stats.correct/S.stats.reviewed*100):0,
    streak:S.stats.streak,
    level:getLevel(S.stats.xp).name,
    ts:Date.now()
  };
  if(existing>=0)lb[existing]=entry;
  else lb.push(entry);
  // Keep top 50
  lb.sort((a,b)=>b.xp-a.xp);
  const trimmed=lb.slice(0,50);
  localStorage.setItem(LEADERBOARD_KEY,JSON.stringify(trimmed));
  return entry;
}

function getLeaderboard(){
  return JSON.parse(localStorage.getItem(LEADERBOARD_KEY)||'[]').sort((a,b)=>b.xp-a.xp);
}

function renderLeaderboard(){
  const lb=getLeaderboard();
  const playerId=getPlayerId();
  if(!lb.length)return'<p style="color:var(--text2);font-size:.85rem;text-align:center;padding:20px">هنوز امتیازی ثبت نشده</p>';
  let h='<div style="max-height:300px;overflow-y:auto">';
  lb.slice(0,20).forEach((e,i)=>{
    const isMe=e.id===playerId;
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1);
    h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);'+(isMe?'background:var(--accent-glow);border-radius:8px;':'')+'">';
    h+='<span style="min-width:28px;text-align:center;font-size:1rem">'+medal+'</span>';
    h+='<div style="flex:1"><div style="font-size:.85rem;font-weight:'+(isMe?'700':'400')+'">'+(isMe?'شما':'بازیکن')+'</div>';
    h+='<div style="font-size:.7rem;color:var(--text2)">'+esc(e.level)+' • '+e.words+' کلمه • دقت '+e.accuracy+'%</div></div>';
    h+='<div style="text-align:left"><div style="font-size:.9rem;font-weight:700;color:var(--accent)">'+e.xp.toLocaleString()+' XP</div>';
    if(e.streak>0)h+='<div style="font-size:.65rem;color:var(--warning)">🔥 '+e.streak+' روز</div>';
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

// ═══════════════════════════════════════════
// FSRS ALGORITHM (self-contained, improved)
// ═══════════════════════════════════════════
// FSRS-5 weights (17 parameters) — tuned defaults
const FSRS_W=[0.4,0.6,2.4,5.8,4.93,0.94,0.86,0.01,1.49,0.14,0.94,2.18,0.05,0.34,1.26,0.29,2.61];
const FSRS_RETENTION=0.9;
const FSRS_MAX_INTERVAL=365;
const FSRS_DECAY=-0.5; // Power-law decay exponent

function fsrsRetrieveProbability(stability,elapsed){
  if(stability<=0)return 0;
  return Math.pow(1+elapsed/(FSRS_W[9]*stability),FSRS_DECAY);
}
function fsrsInitialDifficulty(rating){
  return Math.min(Math.max(FSRS_W[4]-Math.exp(FSRS_W[5]*(rating-1))+1,1),10);
}
function fsrsInitialStability(rating){return FSRS_W[rating-1]}

// Short-term stability model: after first learning step
function fsrsShortTermStability(stability,rating){
  // Stability boost for short-term reviews (same-day)
  return stability*Math.exp(FSRS_W[15]*(rating-3));
}

// Interval fuzzing: add ±5% jitter to prevent review clustering
function fuzzInterval(interval){
  if(interval<=2)return interval;
  const fuzzRange=Math.max(1,Math.round(interval*0.05));
  const fuzzed=interval+Math.floor(Math.random()*(2*fuzzRange+1))-fuzzRange;
  return Math.max(1,fuzzed);
}

function fsrsNext(w,rating){
  // rating: 1=Again,2=Hard,3=Good,4=Easy
  const state=w.fsrsState||'new';
  const now=new Date();
  let newStability,newDifficulty,newInterval,newState,newLapses=w.lapses||0;

  if(state==='new'||state==='learning'){
    // First encounter or still in learning phase
    if(rating===1){
      newStability=Math.max(FSRS_W[0],0.1);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=0; // Immediate retry
      newState='learning';
      newLapses=w.lapses||0;
    }else if(rating===2){
      // Hard: short stability, review tomorrow
      newStability=Math.max(FSRS_W[1]*1.2,0.2);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=1;
      newState='review';
    }else if(rating===3){
      // Good: standard initial stability
      newStability=Math.max(fsrsShortTermStability(FSRS_W[2],rating),0.5);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=Math.max(1,Math.round(FSRS_W[2]));
      newState='review';
    }else{
      // Easy: high initial stability
      newStability=Math.max(FSRS_W[3],1);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=Math.max(1,Math.round(FSRS_W[3]));
      newState='review';
    }
  }else if(state==='review'){
    const elapsed=w.elapsedDays||0;
    const retrievability=fsrsRetrieveProbability(w.stability,Math.max(elapsed,0));

    // Difficulty update: mean-reverting toward initial difficulty
    const difficultyDelta=-FSRS_W[6]*(rating-3);
    newDifficulty=Math.min(Math.max(w.difficulty+difficultyDelta,1),10);
    // Mean-reversion: difficulty trends back toward initial based on rating
    const initialD=fsrsInitialDifficulty(rating);
    newDifficulty=newDifficulty+FSRS_W[13]*(initialD-newDifficulty);

    if(rating===1){
      // Again: lapse, go to relearning
      newLapses=(w.lapses||0)+1;
      // Stability after lapse: penalized by retrievability
      const lapseStability=FSRS_W[11]*Math.pow(newDifficulty,-FSRS_W[12])*
        (Math.pow(w.stability+1,FSRS_W[13])-1)*
        Math.exp(FSRS_W[14]*(1-retrievability));
      newStability=Math.max(lapseStability,0.1);
      newInterval=1;
      newState='relearning';
    }else{
      // Hard/Good/Easy: stability growth
      const hardPenalty=rating===2?FSRS_W[15]:1;
      const easyBonus=rating===4?FSRS_W[16]:1;
      // Stability growth factor depends on difficulty, stability, and retrievability
      const stabilityGrowth=1+Math.exp(FSRS_W[7])*
        (11-newDifficulty)*
        Math.pow(w.stability,-FSRS_W[8])*
        (Math.exp(FSRS_W[10]*(1-retrievability))-1)*
        hardPenalty*easyBonus;
      newStability=Math.max(w.stability*stabilityGrowth,0.1);

      // Interval from stability with retention target
      if(rating===2)newInterval=Math.max(1,Math.round(w.interval*1.2));
      else if(rating===3)newInterval=Math.max(1,Math.round(newStability*FSRS_DECAY_COEFF*Math.log(FSRS_RETENTION)/Math.log(0.9)));
      else newInterval=Math.max(1,Math.round(newStability*FSRS_DECAY_COEFF*1.3));
      newState='review';
    }
  }else if(state==='relearning'){
    if(rating===1){
      newStability=Math.max(FSRS_W[0],0.1);
      newInterval=1;
      newState='relearning';
      newLapses=(w.lapses||0);
    }else{
      // Return to review
      newStability=Math.max(w.stability||FSRS_W[0],0.1);
      newDifficulty=w.difficulty||fsrsInitialDifficulty(rating);
      newInterval=1;
      newState='review';
      newLapses=w.lapses||0;
    }
  }else{
    // Unknown state, treat as new
    newStability=Math.max(FSRS_W[0],0.1);
    newDifficulty=fsrsInitialDifficulty(rating);
    newInterval=1;
    newState='learning';
    newLapses=0;
  }

  // Clamp values
  newStability=Math.max(newStability,0.1);
  newInterval=Math.min(Math.max(Math.round(newInterval),0),FSRS_MAX_INTERVAL);
  if(newInterval===0)newInterval=1;

  // Apply fuzzing to prevent review clustering
  newInterval=fuzzInterval(newInterval);

  // Update card
  w.stability=newStability;
  w.difficulty=newDifficulty;
  w.interval=newInterval;
  w.fsrsState=newState;
  w.lapses=newLapses;
  w.reps=(w.reps||0)+1;
  w.elapsedDays=0;
  w.scheduledDays=newInterval;
  w.nextReviewDate=new Date(now.getTime()+newInterval*MS_PER_DAY).toISOString();
  w.lastReviewedAt=now.toISOString();
  w.box=Math.min(10,Math.ceil(newStability/30));
  w.easeFactor=Math.max(1.3,3-newDifficulty/5);
  return w;
}

function clampReviewValues(w){
  w.repetitions=Math.max(0,Number(w.repetitions)||0);
  w.interval=Math.max(1,Number(w.interval)||1);
  w.easeFactor=Math.max(1.3,Number(w.easeFactor)||2.5);
  w.box=Math.max(0,Math.min(10,Number(w.box)||0));
  if(w.nextReviewDate&&isNaN(new Date(w.nextReviewDate).getTime()))w.nextReviewDate=null;
  if(w.lastReviewedAt&&isNaN(new Date(w.lastReviewedAt).getTime()))w.lastReviewedAt=null;
  // Ensure FSRS fields exist
  if(w.stability===undefined)w.stability=0;
  if(w.difficulty===undefined)w.difficulty=0;
  if(w.fsrsState===undefined)w.fsrsState='new';
}

function sm2Legacy(w,q){
  clampReviewValues(w);
  const now=Date.now();
  if(q<3){w.repetitions=0;w.interval=1}
  else{w.repetitions++;if(w.repetitions===1)w.interval=1;else if(w.repetitions===2)w.interval=6;else w.interval=Math.round(w.interval*w.easeFactor)}
  w.easeFactor+=(0.1-(5-q)*(0.08+(5-q)*0.02));
  if(w.easeFactor<1.3)w.easeFactor=1.3;
  w.nextReviewDate=new Date(now+w.interval*MS_PER_DAY).toISOString();
  w.lastReviewedAt=new Date(now).toISOString();
  w.box=Math.min(10,w.repetitions);
  return w}

// Map old 1-5 rating to FSRS 1-4
function mapRating(q){return q<=1?1:q<=3?2:q===4?3:4}

async function fetchDictionary(word){
  try{
    const r=await fetch(DICT_API+'/'+encodeURIComponent(word),{headers:{Accept:'application/json'}});
    if(!r.ok)return null;
    const data=await r.json();
    if(!Array.isArray(data)||!data[0])return null;
    const e=data[0];
    const phonetics=Array.isArray(e.phonetics)?e.phonetics:[];
    const phoneticBr=phonetics.filter(p=>typeof p.audio==='string'&&/-uk\.mp3/i.test(p.audio)).map(p=>typeof p.text==='string'?p.text.trim():'').find(Boolean)||null;
    const phoneticUs=phonetics.filter(p=>typeof p.audio==='string'&&/-us\.mp3/i.test(p.audio)).map(p=>typeof p.text==='string'?p.text.trim():'').find(Boolean)||null;
    const audioBr=phonetics.filter(p=>typeof p.audio==='string'&&/-uk\.mp3/i.test(p.audio)).map(p=>p.audio).find(Boolean)||null;
    const audioUs=phonetics.filter(p=>typeof p.audio==='string'&&/-us\.mp3/i.test(p.audio)).map(p=>p.audio).find(Boolean)||null;
    const phonetic=phoneticBr||phoneticUs||phonetics.map(p=>typeof p.text==='string'?p.text.trim():'').find(Boolean)||null;
    const meanings=(Array.isArray(e.meanings)?e.meanings:[]).slice(0,4).map(m=>{
      const defs=(Array.isArray(m.definitions)?m.definitions:[]).slice(0,3).map(d=>typeof d.definition==='string'?d.definition.trim():'').filter(Boolean);
      const examples=(Array.isArray(m.definitions)?m.definitions:[]).slice(0,2).map(d=>typeof d.example==='string'?d.example.trim():'').filter(Boolean);
      const synonyms=[...(Array.isArray(m.synonyms)?m.synonyms:[]),...(Array.isArray(m.definitions)?m.definitions:[]).flatMap(d=>Array.isArray(d.synonyms)?d.synonyms:[])].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4).filter(s=>typeof s==='string').map(s=>s.trim());
      return{partOfSpeech:m.partOfSpeech||'',definitions:defs,examples,synonyms}});
    return{headword:e.word||word,phonetic,phoneticBr,phoneticUs,audioBr,audioUs,meanings}
  }catch(e){return null}}

async function fetchTranslation(word,fromLang,toLang){

async function fetchEtymology(word){
  try{
    const r=await fetch('https://en.wiktionary.org/api/rest_v1/page/etymology/'+encodeURIComponent(word));
    if(!r.ok)return null;
    const data=await r.json();
    if(data&&data.extract)return data.extract;
    // Fallback: try the definition endpoint
    const r2=await fetch('https://en.wiktionary.org/api/rest_v1/definition/'+encodeURIComponent(word));
    if(!r2.ok)return null;
    const data2=await r2.json();
    if(data2&&data2.en&&data2.en[0]&&data2.en[0].etymology)return data2.en[0].etymology;
    return null;
  }catch(e){return null}
}

// MORPHOLOGICAL FAMILY (word forms)
// ═══════════════════════════════════════════
const MORPH_SUFFIXES={
  verb:['ing','ed','es','s','er','ers','tion','ment','ance','ence','ive','able','ible'],
  noun:['s','es','tion','ment','ance','ence','ist','ism','ity','ness','er','or','age','ure','dom','ship'],
  adj:['ly','ness','er','est','ity','ism','ize','ise','ful','less','ous','ive','able','ible','al','ial'],
  adv:['ly','ness']
};

function getMorphologicalFamily(word){
  const w=word.toLowerCase();
  const family=new Set();
  family.add(w);
  // Strip common suffixes to find root
  for(const suffixes of Object.values(MORPH_SUFFIXES)){
    for(const s of suffixes){
      if(w.endsWith(s)&&w.length>s.length+2){
        const root=w.slice(0,-s.length);
        family.add(root);
        // Generate common forms from root
        family.add(root+'ing');family.add(root+'ed');family.add(root+'s');
        family.add(root+'tion');family.add(root+'ment');family.add(root+'ness');
        family.add(root+'ly');family.add(root+'er');family.add(root+'est');
        family.add(root+'ful');family.add(root+'less');family.add(root+'ous');
        family.add(root+'ive');family.add(root+'able');family.add(root+'ist');
        family.add(root+'ism');family.add(root+'ity');family.add(root+'ize');
        break;
      }
    }
  }
  // Also check if word itself is a root
  if(w.length>=3){
    family.add(w+'ing');family.add(w+'ed');family.add(w+'s');
    family.add(w+'tion');family.add(w+'ment');family.add(w+'ness');
    family.add(w+'ly');family.add(w+'er');family.add(w+'ful');
    family.add(w+'less');family.add(w+'ous');family.add(w+'ive');
    family.add(w+'able');family.add(w+'ist');family.add(w+'ism');
  }
  family.delete(w); // remove the word itself
  return[...family].filter(f=>f.length>=3).slice(0,12);
}

  carry:['out','on','away','through','over','weight','off','forward']
};

function suggestCollocations(word){
  const w=word.toLowerCase();
  if(COMMON_COLLOCATIONS[w])return COMMON_COLLOCATIONS[w];
  // Check if word appears in any collocation
  const suggestions=[];
  for(const[verb,colls]of Object.entries(COMMON_COLLOCATIONS)){
    for(const c of colls){
      if(c.includes(w))suggestions.push(verb+' '+c);
    }
  }
  return suggestions.slice(0,5);
}

function getFrequencyRank(word){
  const w=word.toLowerCase();
  // Approximate COCA rank from tier membership
  if(FREQ_T1.has(w)){
    // Top 500: assign position within set
    const t1Arr=[...FREQ_T1];
    const idx=t1Arr.indexOf(w);
    return idx>=0?idx+1:250;
  }
  if(FREQ_T2.has(w))return 500+Math.floor(Math.random()*500);
  if(FREQ_T3.has(w))return 1000+Math.floor(Math.random()*4000);
  return null; // not in top 5000
}

  result.freqRank=getFrequencyRank(word);

// AUTO-BACKUP (IndexedDB) — versioned snapshots
// ═══════════════════════════════════════════
const BACKUP_STORE='backups';
const BACKUP_META_STORE='backup_meta';
const MAX_BACKUPS=10;
let backupDb=null;
let _backupCounter=0;

function openBackupDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('leitner_backup_db',2);
    req.onupgradeneeded=(e)=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(BACKUP_STORE))db.createObjectStore(BACKUP_STORE);
      if(!db.objectStoreNames.contains(BACKUP_META_STORE))db.createObjectStore(BACKUP_META_STORE);
    };
    req.onsuccess=()=>{backupDb=req.result;resolve(req.result)};
    req.onerror=()=>reject(req.error)});
}

async function autoBackup(){
  _backupCounter++;
  // Backup every 20 saves (not every single save)
  if(_backupCounter<20)return;
  _backupCounter=0;
  try{
    const db=backupDb||await openBackupDb();
    const now=new Date();
    const ts=now.toISOString();
    const snapshot=JSON.stringify(S);
    const tx=db.transaction([BACKUP_STORE,BACKUP_META_STORE],'readwrite');
    // Save snapshot with timestamp key
    const key='snap_'+ts;
    tx.objectStore(BACKUP_STORE).put(snapshot,key);
    // Update meta: list of snapshot keys + pointer to latest
    const metaStore=tx.objectStore(BACKUP_META_STORE);
    metaStore.put(ts,'latest_ts');
    const metaReq=metaStore.get('snapshot_keys');
    metaReq.onsuccess=()=>{
      let keys=metaReq.result||[];
      keys.push(key);
      // Prune old snapshots beyond MAX_BACKUPS
      while(keys.length>MAX_BACKUPS){
        const old=keys.shift();
        try{tx.objectStore(BACKUP_STORE).delete(old)}catch(e){}}
      metaStore.put(keys,'snapshot_keys');
    };
  }catch(e){}}

// Get list of available snapshots
async function listSnapshots(){
  try{
    const db=backupDb||await openBackupDb();
    return new Promise(resolve=>{
      const tx=db.transaction(BACKUP_META_STORE,'readonly');
      const req=tx.objectStore(BACKUP_META_STORE).get('snapshot_keys');
      req.onsuccess=()=>resolve((req.result||[]).reverse());
      req.onerror=()=>resolve([])});
  }catch(e){return[]}}

// Restore a specific snapshot by key
async function restoreSnapshot(key){
  try{
    const db=backupDb||await openBackupDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(BACKUP_STORE,'readonly');
      const req=tx.objectStore(BACKUP_STORE).get(key);
      req.onsuccess=()=>{try{resolve(JSON.parse(req.result))}catch(e){resolve(null)}};
      req.onerror=()=>resolve(null)});
  }catch(e){return null}}

// Get latest snapshot (backward compat)
async function exportBackup(){
  try{
    const db=backupDb||await openBackupDb();
    const tsTx=db.transaction(BACKUP_META_STORE,'readonly');
    const tsReq=tsTx.objectStore(BACKUP_META_STORE).get('latest_ts');
    return new Promise(resolve=>{
      tsReq.onsuccess=()=>{
        const ts=tsReq.result;
        if(!ts){resolve(null);return}
        const key='snap_'+ts;
        const tx=db.transaction(BACKUP_STORE,'readonly');
        const req=tx.objectStore(BACKUP_STORE).get(key);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>resolve(null)};
      tsReq.onerror=()=>resolve(null)});
  }catch(e){return null}}

// Legacy compat: restoreBackup returns latest
async function restoreBackup(){
  try{
    const data=await exportBackup();
    return data?JSON.parse(data):null;
  }catch(e){return null}}

// Delete a specific snapshot
async function deleteSnapshot(key){
  try{
    const db=backupDb||await openBackupDb();
    const tx=db.transaction([BACKUP_STORE,BACKUP_META_STORE],'readwrite');
    tx.objectStore(BACKUP_STORE).delete(key);
    const metaReq=tx.objectStore(BACKUP_META_STORE).get('snapshot_keys');
    metaReq.onsuccess=()=>{
      let keys=(metaReq.result||[]).filter(k=>k!==key);
      tx.objectStore(BACKUP_META_STORE).put(keys,'snapshot_keys');
    };
  }catch(e){}}

iv></div></div></div><div class="rating-bar" id="ratingBar" style="display:none"><button type="button" class="btn btn-danger btn-sm" data-rate="1">❌ نادرست <kbd style="font-size:.6rem;opacity:.6">۱</kbd></button><button type="button" class="btn btn-ghost btn-sm" data-rate="3">😐 سخت <kbd style="font-size:.6rem;opacity:.6">۲</kbd></button><button type="button" class="btn btn-primary btn-sm" data-rate="4">🙂 خوب <kbd style="font-size:.6rem;opacity:.6">۳</kbd></button><button type="button" class="btn btn-success btn-sm" data-rate="5">😄 عالی <kbd style="font-size:.6rem;opacity:.6">۴</kbd></button></div><div style="text-align:center;margin-top:12px"><button type="button" class="btn btn-ghost btn-sm" id="wordDrillBtn" style="font-size:.8rem;gap:6px">📚 تمرین و توضیح کلمه</button></div></div>`;

function rateReview(q){
if(reviewRatingPending)return;
reviewRatingPending=true;
const w=reviewSession.queue[reviewSession.idx];
const idx=S.words.findIndex(x=>x.id===w.id);
if(idx>=0)fsrsNext(S.words[idx],mapRating(q));
S.stats.reviewed++;S.stats.xp+={1:0,2:3,3:5,4:8,5:10}[q]||0;
if(q>=4)S.stats.correct++;else S.stats.wrong++;
const dk=todayKey();if(S.stats.lastReviewDate!==dk){if(S.stats.lastReviewDate===new Date(Date.now()-MS_PER_DAY).toISOString().slice(0,10))S.stats.streak++;else S.stats.streak=1;S.stats.lastReviewDate=dk}
if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};
S.stats.history[dk].reviewed++;if(q>=4)S.stats.history[dk].correct++;else S.stats.history[dk].wrong++;
save();
reviewSession.idx++;reviewSession.flipped=false;
if(reviewSession.idx>=reviewSession.queue.length)reviewSession.done=true;
reviewRatingPending=false;
renderReview(document.getElementById('content'))}
function reviewKeyHandler(e){
if(autoPlayState.active)return;
if(document.querySelector('.modal-overlay'))return;
if(e.key===' '&&reviewSession.flipped===false&&currentTab==='review'){e.preventDefault();const card=document.getElementById('rCard');if(card){reviewSession.flipped=true;card.classList.add('flipped');document.getElementById('ratingBar').style.display='flex'}}
if(reviewSession.flipped&&currentTab==='review'&&!reviewRatingPending){const map={'1':1,'2':3,'3':4,'4':5};if(map[e.key])rateReview(map[e.key])}}

function openWordDrill(w) {
  const word = w.word;
  const trans = w.translation || '';
  const pos = w.partOfSpeech || '';
  const ipa = w.ipa || '';
  const examples = w.examples || [];
  const synonyms = w.synonyms || [];
  const antonyms = w.antonyms || [];
  const note = w.note || '';

  // Build explanation content
  let explainHtml = '';

  // Word header
  explainHtml += '<div style="text-align:center;margin-bottom:16px">';
  explainHtml += '<div style="font-size:1.6rem;font-weight:800;color:var(--accent)">' + esc(word) + '</div>';
  if (ipa) explainHtml += '<div style="color:var(--text2);font-size:.9rem;margin-top:2px">' + esc(ipa) + '</div>';
  if (pos) explainHtml += '<div style="margin-top:4px"><span class="badge badge-accent">' + esc(pos) + '</span></div>';
  explainHtml += '<div style="font-size:1.2rem;font-weight:600;margin-top:8px">' + esc(trans) + '</div>';
  explainHtml += '</div>';

  // Examples
  if (examples.length) {
    explainHtml += '<div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px;border-right:3px solid var(--accent)">';
    explainHtml += '<div style="font-size:.8rem;font-weight:600;color:var(--accent);margin-bottom:6px">💬 مثال‌ها:</div>';
    examples.slice(0, 3).forEach(ex => {
      explainHtml += '<div style="font-size:.85rem;color:var(--text);margin-bottom:6px;line-height:1.7">• ' + esc(ex) + '</div>';
    });
    explainHtml += '</div>';
  }

  // Synonyms & Antonyms
  if (synonyms.length || antonyms.length) {
    explainHtml += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">';
    if (synonyms.length) {
      explainHtml += '<div style="flex:1;min-width:140px;background:var(--bg);border-radius:10px;padding:10px">';
      explainHtml += '<div style="font-size:.75rem;color:var(--success);font-weight:600;margin-bottom:4px">🔄 مترادف‌ها</div>';
      explainHtml += '<div style="font-size:.82rem;color:var(--text)">' + synonyms.slice(0, 5).map(s => esc(s)).join('، ') + '</div>';
      explainHtml += '</div>';
    }
    if (antonyms.length) {
      explainHtml += '<div style="flex:1;min-width:140px;background:var(--bg);border-radius:10px;padding:10px">';
      explainHtml += '<div style="font-size:.75rem;color:var(--danger);font-weight:600;margin-bottom:4px">⚡ متضادها</div>';
      explainHtml += '<div style="font-size:.82rem;color:var(--text)">' + antonyms.slice(0, 5).map(a => esc(a)).join('، ') + '</div>';
      explainHtml += '</div>';
    }
    explainHtml += '</div>';
  }

  // Note
  if (note) {
    explainHtml += '<div style="background:var(--bg);border-radius:10px;padding:10px;margin-bottom:10px;border-right:3px solid var(--warning)">';
    explainHtml += '<div style="font-size:.75rem;color:var(--warning);font-weight:600;margin-bottom:4px">💡 یادداشت</div>';
    explainHtml += '<div style="font-size:.85rem;color:var(--text)">' + esc(note) + '</div>';
    explainHtml += '</div>';
  }

  // Memory tricks
  explainHtml += '<div style="background:var(--bg);border-radius:10px;padding:10px;margin-bottom:10px;border-right:3px solid var(--accent)">';
  explainHtml += '<div style="font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:4px">🧠 ترفند حفظ کردن</div>';
  explainHtml += '<div style="font-size:.85rem;color:var(--text);line-height:1.7">' + getMemoryTrick(word, trans, pos) + '</div>';
  explainHtml += '</div>';

  // Usage tip
  explainHtml += '<div style="background:var(--bg);border-radius:10px;padding:10px;margin-bottom:10px;border-right:3px solid var(--success)">';
  explainHtml += '<div style="font-size:.75rem;color:var(--success);font-weight:600;margin-bottom:4px">📝 نکته استفاده</div>';
  explainHtml += '<div style="font-size:.85rem;color:var(--text);line-height:1.7">' + getUsageTip(word, trans, pos) + '</div>';
  explainHtml += '</div>';

  // ── Build quiz content ──
  let quizHtml = '';
  const quiz = generateWordQuiz(w);
  quizHtml += '<div style="margin-bottom:16px">';
  quizHtml += '<div style="font-size:1rem;font-weight:700;margin-bottom:12px;text-align:center">🎯 آزمون از کلمه «' + esc(word) + '»</div>';
  quiz.forEach((q, qi) => {
    quizHtml += '<div class="wd-quiz-q" data-qi="' + qi + '" style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:10px">';
    quizHtml += '<div style="font-size:.88rem;font-weight:600;margin-bottom:10px">' + (qi + 1) + '. ' + esc(q.question) + '</div>';
    q.options.forEach((opt, oi) => {
      quizHtml += '<button type="button" class="wd-quiz-opt" data-qi="' + qi + '" data-oi="' + oi + '" style="width:100%;text-align:right;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:.85rem;cursor:pointer;margin-bottom:6px;transition:all .2s;display:block">' + esc(opt) + '</button>';
    });
    quizHtml += '<div class="wd-quiz-feedback" data-qi="' + qi + '" style="display:none;margin-top:8px;font-size:.82rem;padding:8px;border-radius:8px"></div>';
    quizHtml += '</div>';
  });
  quizHtml += '<div id="wdQuizScore" style="text-align:center;margin-top:16px;display:none"></div>';
  quizHtml += '</div>';

  // ── Create modal ──
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div style="background:var(--card);border-radius:var(--radius);width:min(520px,95vw);max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)">'
    + '<div style="font-size:1rem;font-weight:700">📚 تمرین و توضیح کلمه</div>'
    + '<button type="button" class="btn btn-ghost btn-sm" id="wdClose" style="padding:4px 10px">✕</button>'
    + '</div>'
    + '<div style="display:flex;border-bottom:1px solid var(--border)">'
    + '<button type="button" class="wd-tab active" data-tab="explain" style="flex:1;padding:10px;border:none;background:none;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;border-bottom:2px solid var(--accent);transition:all .2s">📖 توضیحات</button>'
    + '<button type="button" class="wd-tab" data-tab="quiz" style="flex:1;padding:10px;border:none;background:none;color:var(--text2);font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s">🎯 آزمون</button>'
    + '</div>'
    + '<div style="flex:1;overflow-y:auto;padding:20px">'
    + '<div id="wdExplainContent">' + explainHtml + '</div>'
    + '<div id="wdQuizContent" style="display:none">' + quizHtml + '</div>'
    + '</div>'
    + '</div>';
  document.body.appendChild(ov);
  ov.querySelector('#wdClose').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };

  // Tab switching
  ov.querySelectorAll('.wd-tab').forEach(tab => {
    tab.onclick = () => {
      ov.querySelectorAll('.wd-tab').forEach(t => {
        t.style.color = 'var(--text2)';
        t.style.borderBottomColor = 'transparent';
        t.style.fontWeight = '500';
        t.classList.remove('active');
      });
      tab.style.color = 'var(--accent)';
      tab.style.borderBottomColor = 'var(--accent)';
      tab.style.fontWeight = '600';
      tab.classList.add('active');
      ov.querySelector('#wdExplainContent').style.display = tab.dataset.tab === 'explain' ? 'block' : 'none';
      ov.querySelector('#wdQuizContent').style.display = tab.dataset.tab === 'quiz' ? 'block' : 'none';
    };
  });

  // Quiz option click
  let quizAnswered = new Set();
  ov.querySelectorAll('.wd-quiz-opt').forEach(btn => {
    btn.onclick = () => {
      const qi = parseInt(btn.dataset.qi);
      const oi = parseInt(btn.dataset.oi);
      if (quizAnswered.has(qi)) return;
      quizAnswered.add(qi);
      const correct = quiz[qi].correct;
      const feedback = ov.querySelector('.wd-quiz-feedback[data-qi="' + qi + '"]');
      if (oi === correct) {
        btn.style.background = 'linear-gradient(135deg,var(--success),#00d2a0)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--success)';
        feedback.style.display = 'block';
        feedback.style.background = 'rgba(0,184,148,.1)';
        feedback.style.color = 'var(--success)';
        feedback.textContent = '✅ درست! ' + (quiz[qi].explanation || '');
      } else {
        btn.style.background = 'linear-gradient(135deg,var(--danger),#f0825e)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--danger)';
        // Highlight correct answer
        const correctBtn = ov.querySelector('.wd-quiz-opt[data-qi="' + qi + '"][data-oi="' + correct + '"]');
        if (correctBtn) {
          correctBtn.style.background = 'linear-gradient(135deg,var(--success),#00d2a0)';
          correctBtn.style.color = '#fff';
          correctBtn.style.borderColor = 'var(--success)';
        }
        feedback.style.display = 'block';
        feedback.style.background = 'rgba(225,112,85,.1)';
        feedback.style.color = 'var(--danger)';
        feedback.textContent = '❌ نادرست! ' + (quiz[qi].explanation || '');
      }
      // Check if all answered
      if (quizAnswered.size === quiz.length) {
        let correctCount = 0;
        ov.querySelectorAll('.wd-quiz-opt').forEach(b => {
          if (b.style.borderColor === 'var(--success)' && b.style.color === 'rgb(255, 255, 255)') {
            const qIdx = parseInt(b.dataset.qi);
            const oIdx = parseInt(b.dataset.oi);
            if (quiz[qIdx].correct === oIdx) correctCount++;
          }
        });
        const scoreEl = ov.querySelector('#wdQuizScore');
        scoreEl.style.display = 'block';
        const pct = Math.round(correctCount / quiz.length * 100);
        const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚';
        scoreEl.innerHTML = '<div style="font-size:1.2rem;font-weight:700;margin-bottom:8px">' + emoji + ' نتیجه: ' + correctCount + ' از ' + quiz.length + ' (' + pct + '%)</div>'
          + '<button type="button" class="btn btn-primary btn-sm" id="wdQuizRetry">🔄 تلاش مجدد</button>';
        ov.querySelector('#wdQuizRetry').onclick = () => {
          quizAnswered.clear();
          ov.querySelectorAll('.wd-quiz-opt').forEach(b => {
            b.style.background = 'var(--card)';
            b.style.color = 'var(--text)';
            b.style.borderColor = 'var(--border)';
          });
          ov.querySelectorAll('.wd-quiz-feedback').forEach(f => f.style.display = 'none');
          scoreEl.style.display = 'none';
        };
      }
    };
  });
}

// ── Memory trick generator ──
function getMemoryTrick(word, trans, pos) {
  const w = word.toLowerCase();
  // Try to find patterns for mnemonic
  let tricks = [];
  // Check for common prefixes/suffixes
  const prefixes = {
    'un': 'پیشوند «un-» = نفی (مثال: unhappy = ناشاد)',
    're': 'پیشوند «re-» = دوباره (مثال: rewrite = بازنویسی)',
    'pre': 'پیشوند «pre-» = قبل (مثال: preview = پیش‌نمایش)',
    'dis': 'پیشوند «dis-» = نفی (مثال: disagree = مخالفت)',
    'mis': 'پیشوند «mis-» = غلط (مثال: mistake = اشتباه)',
    'over': 'پیشوند «over-» = بیش از حد (مثال: overload = اضافه‌بار)',
    'out': 'پیشوند «out-» = بیشتر از (مثال: outperform = بهتر عمل کردن)',
    'inter': 'پیشوند «inter-» = بین (مثال: international = بین‌المللی)',
    'trans': 'پیشوند «trans-» = از طریق/فراتر (مثال: transport = حمل‌ونقل)',
    'sub': 'پیشوند «sub-» = زیر (مثال: submarine = زیردریایی)',
    'super': 'پیشوند «super-» = بالا/فوق (مثال: superhero = ابرقهرمان)',
    'anti': 'پیشوند «anti-» = ضد (مثال: antivirus = ضدویروس)',
    'auto': 'پیشوند «auto-» = خود (مثال: automatic = خودکار)',
    'bi': 'پیشوند «bi-» = دو (مثال: bicycle = دوچرخه)',
    'multi': 'پیشوند «multi-» = چند (مثال: multilingual = چندزبانه)'
  };
  const suffixes = {
    'tion': 'پسوند «-tion» = اسم مصدر (مثال: education = آموزش)',
    'sion': 'پسوند «-sion» = اسم مصدر (مثال: decision = تصمیم)',
    'ness': 'پسوند «-ness» = اسم کیفیت (مثال: happiness = خوشبختی)',
    'ment': 'پسوند «-ment» = اسم (مثال: development = توسعه)',
    'able': 'پسوند «-able» = صفت قابلیت (مثال: readable = خواندنی)',
    'ible': 'پسوند «-ible» = صفت قابلیت (مثال: flexible = انعطاف‌پذیر)',
    'ful': 'پسوند «-ful» = پر از (مثال: beautiful = زیبا)',
    'less': 'پسوند «-less» = بدون (مثال: homeless = بی‌خانمان)',
    'ous': 'پسوند «-ous» = دارای (مثال: dangerous = خطرناک)',
    'ive': 'پسوند «-ive» = صفت فاعلی (مثال: creative = خلاق)',
    'ly': 'پسوند «-ly» = قید (مثال: quickly = سریعاً)',
    'er': 'پسوند «-er» = تفضیلی/فاعل (مثال: bigger = بزرگتر)',
    'est': 'پسوند «-est» = اعلا (مثال: biggest = بزرگترین)',
    'ize': 'پسوند «-ize» = فعل (مثال: organize = سازماندهی)',
    'al': 'پسوند «-al» = صفت (مثال: natural = طبیعی)'
  };
  for (const [pfx, desc] of Object.entries(prefixes)) {
    if (w.startsWith(pfx) && w.length > pfx.length + 2) {
      tricks.push('🔍 ' + desc);
    }
  }
  for (const [sfx, desc] of Object.entries(suffixes)) {
    if (w.endsWith(sfx) && w.length > sfx.length + 2) {
      tricks.push('🔍 ' + desc);
    }
  }
  // Letter-based association
  const firstLetter = w[0];
  const associations = {
    'a': 'مثل «always» — همیشه شروع کن!', 'b': 'مثل «big» — بزرگ فکر کن!',
    'c': 'مثل «create» — خلق کن!', 'd': 'مثل «dream» — رویا ببین!',
    'e': 'مثل «energy» — انرژی بده!', 'f': 'مثل «fly» — پرواز کن!',
    'g': 'مثل «grow» — رشد کن!', 'h': 'مثل «hope» — امیدوار باش!',
    'i': 'مثل «imagine» — تصور کن!', 'j': 'مثل «joy» — شادی کن!',
    'k': 'مثل «knowledge» — علم بیاموز!', 'l': 'مثل "love" — عشق بورز!',
    'm': 'مثل «magic» — جادو کن!', 'n': 'مثل «nature» — طبیعت!',
    'o': 'مثل «open» — باز کن!', 'p': 'مثل «power» — قدرت!',
    'q': 'مثل «question» — سوال کن!', 'r': 'مثل «rise» — بلند شو!',
    's': 'مثل «shine» — بدرخش!', 't': 'مثل «trust» — اعتماد کن!',
    'u': 'مثل «unique» — منحصر‌به‌فرد!', 'v': 'مثل "victory" — پیروزی!',
    'w': 'مثل «wisdom» — حکمت!', 'x': 'مثل «xenial» — مهمان‌نواز!',
    'y': 'مثل «youth» — جوانی!', 'z': 'مثل «zenith» — اوج!'
  };
  if (associations[firstLetter]) {
    tricks.push('🔤 حرف اول «' + firstLetter.toUpperCase() + '» — ' + associations[firstLetter]);
  }
  // Word length trick
  if (w.length <= 4) tricks.push('📏 کلمه کوتاهه — فقط ' + w.length + ' حرف! راحت حفظش کن.');
  else if (w.length >= 8) tricks.push('📏 کلمه بلنده — به بخش‌ها تقسیمش کن: ' + w.match(/.{1,3}/g).join('-'));
  // Rhyme/sound similarity
  const rhymes = {
    'ight': 'مثل light, night, right — همه «-ight» دارن!',
    'ound': 'مثل sound, found, ground — همه «-ound» دارن!',
    'tion': 'مثل nation, station, action — همه «-tion» دارن!',
    'ness': 'مثل happiness, kindness — همه «-ness» دارن!',
    'ment': 'مثل moment, comment — همه «-ment» دارن!'
  };
  for (const [pattern, desc] of Object.entries(rhymes)) {
    if (w.endsWith(pattern)) {
      tricks.push('🎵 ' + desc);
      break;
    }
  }
  if (tricks.length === 0) {
    tricks.push('💡 سعی کن یه تصویر ذهنی از «' + trans + '» بسازی و به «' + word + '» ربطش بدی.');
  }
  return tricks.join('<br>');
}

// ── Usage tip generator ──
function getUsageTip(word, trans, pos) {
  const tips = [];
  const p = (pos || '').toLowerCase();
  if (p.includes('noun') || p.includes('اسم')) {
    tips.push('📌 این یک اسم است. می‌توانید قبلش «a/an/the» بذارید.');
    tips.push('📌 برای جمع: اگر قاعده‌مند است «-s/-es» اضافه کنید.');
  } else if (p.includes('verb') || p.includes('فعل')) {
    tips.push('📌 این یک فعل است. به زمان‌های مختلف صرف می‌شود.');
    tips.push('📌 حواش بهقاعده بودن یا نبودن ( irregular ) باشید.');
  } else if (p.includes('adj') || p.includes('صفت')) {
    tips.push('📌 این یک صفت است. قبل از اسم می‌آید: «a ' + word + ' person»');
    tips.push('📌 درجه تفضیلی: «more ' + word + '» یا «-er» (اگر کوتاه باشد)');
  } else if (p.includes('adv') || p.includes('قید')) {
    tips.push('📌 این یک قید است. فعل را توصیف می‌کند.');
    tips.push('📌 معمولاً «-ly» دارد و بعد از فعل می‌آید.');
  }
  // Collocation hint
  if (word.length <= 6) {
    tips.push('📌 این کلمه پرکاربرد است — سعی کنید در جمله‌های روزمره استفاده‌اش کنید.');
  }
  // Context tip
  tips.push('📌 یک جمله با «' + word + '» بسازید و بلند بخوانید تا بهتر در ذهنتان بماند.');
  if (tips.length === 0) {
    tips.push('📌 سعی کنید این کلمه را در مکالمه روزمره استفاده کنید.');
  }
  return tips.join('<br>');
}

// ── Quiz generator ──
function generateWordQuiz(w) {
  const quiz = [];
  const word = w.word;
  const trans = w.translation || '';
  const synonyms = w.synonyms || [];
  const antonyms = w.antonyms || [];
  const allWords = (S.words || []).filter(x => x.word !== word && x.translation);

  // Helper: pick random items from array
  function pick(arr, n) {
    const shuffled = [...arr].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, n);
  }

  // Q1: What does this word mean?
  if (trans) {
    const wrongOptions = pick(allWords.map(x => x.translation), 3);
    if (wrongOptions.length >= 3) {
      const options = [trans, ...wrongOptions].sort(() => Math.random() - 0.5);
      const correctIdx = options.indexOf(trans);
      quiz.push({
        question: 'معنی کلمه «' + word + '» چیست؟',
        options: options,
        correct: correctIdx,
        explanation: '«' + word + '» یعنی «' + trans + '»'
      });
    }
  }

  // Q2: Which word means X?
  if (trans) {
    const wrongWords = pick(allWords.map(x => x.word), 3);
    if (wrongWords.length >= 3) {
      const options = [word, ...wrongWords].sort(() => Math.random() - 0.5);
      const correctIdx = options.indexOf(word);
      quiz.push({
        question: 'کدام کلمه به معنی «' + trans + '» است؟',
        options: options,
        correct: correctIdx,
        explanation: '«' + trans + '» معادل «' + word + '» است.'
      });
    }
  }

  // Q3: Synonym question
  if (synonyms.length > 0) {
    const correctSyn = synonyms[0];
    const wrongOptions = pick(allWords.map(x => x.word).filter(x => !synonyms.includes(x)), 3);
    if (wrongOptions.length >= 3) {
      const options = [correctSyn, ...wrongOptions].sort(() => Math.random() - 0.5);
      const correctIdx = options.indexOf(correctSyn);
      quiz.push({
        question: 'کدام گزینه مترادف «' + word + '» است؟',
        options: options,
        correct: correctIdx,
        explanation: 'مترادف «' + word + '» = «' + correctSyn + '»'
      });
    }
  }

  // Q4: Antonym question
  if (antonyms.length > 0) {
    const correctAnt = antonyms[0];
    const wrongOptions = pick(allWords.map(x => x.word).filter(x => !antonyms.includes(x) && x !== word), 3);
    if (wrongOptions.length >= 3) {
      const options = [correctAnt, ...wrongOptions].sort(() => Math.random() - 0.5);
      const correctIdx = options.indexOf(correctAnt);
      quiz.push({
        question: 'کدام گزینه متضاد «' + word + '» است؟',
        options: options,
        correct: correctIdx,
        explanation: 'متضاد «' + word + '» = «' + correctAnt + '»'
      });
    }
  }

  // If we don't have enough questions, add a fill-in-the-blank style
  if (quiz.length < 2 && trans) {
    const wrongOptions = pick(allWords.map(x => x.translation), 3);
    if (wrongOptions.length >= 3) {
      const options = [trans, ...wrongOptions].sort(() => Math.random() - 0.5);
      const correctIdx = options.indexOf(trans);
      quiz.push({
        question: '«' + word + '» در کدام گزینه درست به کار رفته؟',
        options: options.map((t, i) => 'گزینه ' + (i + 1) + ': ' + t),
        correct: correctIdx,
        explanation: 'معنی صحیح «' + word + '» = «' + trans + '»'
      });
    }
  }

  // Ensure at least 1 question
  if (quiz.length === 0) {
    quiz.push({
      question: 'آیا معنی «' + word + '» را می‌دانید؟',
      options: ['بله، می‌دانم', 'خیر، نمی‌دانم', 'تا حدودی', 'نیاز به مرور دارم'],
      correct: 0,
      explanation: '«' + word + '» یعنی «' + trans + '» — بهتر است دوباره مرور کنید.'
    });
  }

  return quiz;
}
